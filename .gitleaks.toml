title = "DIO Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
# Firebase Android client config is public. This exception is limited to the
# committed production client API key; service-account credentials are never allowed.
description = "Firebase Android public client API key"
condition = "AND"
paths = [
  '''^/repo/frontend/google-services\.json$'''
]
regexTarget = "line"
regexes = [
  '''REMOVED_GOOGLE_API_KEY'''
]
