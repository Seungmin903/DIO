spring:
  application:
    name: dio
  profiles:
    default: local
  jpa:
    open-in-view: false

server:
  port: 8080

springdoc:
  paths-to-match: /api/v1/diaries/**, /api/v1/diaries
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    persist-authorization: false

management:
  endpoints:
    web:
      exposure:
        include: health
