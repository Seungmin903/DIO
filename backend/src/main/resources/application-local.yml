# 로컬 PostgreSQL. 루트 .env는 Spring에서 자동으로 읽지 않는다.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:dio}}
    username: ${POSTGRES_USER:dio}
    password: ${POSTGRES_PASSWORD:dio1234}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true

dio:
  diary:
    formats:
      "1":
        width: 1280
        height: 800

# DB 연결 확인용 상세 정보. local 프로필에서만 사용한다.
management:
  endpoint:
    health:
      show-details: always
