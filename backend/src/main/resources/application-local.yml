# 로컬 개발용 설정. DB는 루트의 docker-compose.yml(MySQL)을 사용합니다.
# 값은 루트 .env 와 동일한 기본값을 사용하며, 환경변수로 덮어쓸 수 있습니다.
spring:
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE:dio}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:dio}
    password: ${MYSQL_PASSWORD:dio1234}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
