# 로컬 PostgreSQL. 저장소 루트 또는 backend 작업 디렉터리에서 루트 .env를 읽는다.
spring:
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:dio}}
    username: ${POSTGRES_USER:dio}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true

# DB 연결 확인용 상세 정보. local 프로필에서만 사용한다.
management:
  endpoint:
    health:
      show-details: always

dio:
  local-seed:
    enabled: ${DIO_LOCAL_SEED_ENABLED:false}
    file: ${DIO_LOCAL_SEED_FILE:src/main/resources/db/seed/local-demo.json}
