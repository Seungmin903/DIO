spring:
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    enabled: true

dio:
  signup:
    photos:
      storage: ${SIGNUP_PHOTO_STORAGE:s3}
  diary:
    formats:
      "1":
        width: 1280
        height: 800

server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      internal-proxies: ${AUTH_TRUSTED_PROXY_REGEX:127\.0\.0\.1|::1}

management:
  endpoint:
    health:
      show-details: never
