spring:
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    enabled: true

dio:
  media:
    storage: ${MEDIA_STORAGE:s3}
  signup:
    photos:
      storage: ${MEDIA_STORAGE:s3}

server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      port-header: X-Forwarded-Port
      internal-proxies: ${AUTH_TRUSTED_PROXY_REGEX}

management:
  endpoint:
    health:
      show-details: never
