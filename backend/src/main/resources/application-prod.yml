spring:
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    enabled: true

dio:
  signup:
    photos:
      storage: ${SIGNUP_PHOTO_STORAGE:s3}
  diary:
    formats:
      "1":
        width: 1280
        height: 800

management:
  endpoint:
    health:
      show-details: never
