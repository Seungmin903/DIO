# 기본 테스트는 서버 DB 없이 인메모리 H2로 실행한다. PostgreSQL 검증을 대체하지 않는다.
dio:
  push:
    cleanup:
      enabled: false
  diary:
    receipt-cleanup:
      enabled: false
  auth:
    # 테스트에서만 BCrypt 강도를 최소값으로 낮춰 가입·로그인 반복을 빠르게 한다. 운영 기본값은 12다.
    # 10 미만은 아래 허용값이 있어야 기동한다(AuthPasswordConfig). 이 파일은 배포 jar 에 들어가지 않는다.
    bcrypt-strength: 4
    bcrypt-allow-weak-for-tests: true
    session-cleanup:
      enabled: false

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    # 실제 서버와 동일하게 요청 전체에서 EntityManager를 공유하지 않는다.
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
