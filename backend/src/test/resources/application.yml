# 기본 테스트는 서버 DB 없이 인메모리 H2로 실행한다. PostgreSQL 검증을 대체하지 않는다.
dio:
  push:
    cleanup:
      enabled: false
  diary:
    receipt-cleanup:
      enabled: false
  auth:
    session-cleanup:
      enabled: false

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    # 실제 서버와 동일하게 요청 전체에서 EntityManager를 공유하지 않는다.
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
