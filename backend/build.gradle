plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.f106'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation platform('software.amazon.awssdk:bom:2.42.22')
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:url-connection-client'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// 테스트는 compose·infra 파일과 DB 환경변수처럼 선언되지 않은 입력에 의존하므로 빌드 캐시 결과로 건너뛰지 않는다.
tasks.withType(Test).configureEach {
	outputs.cacheIf { false }
}

tasks.named('test') {
    // Missing generated contracts invalidate UP-TO-DATE on reused runner workspaces.
    outputs.files('build/contracts/member-diary-http.json',
        'build/contracts/member-diary-trash-http.json','build/contracts/member-diary-purge-http.json')
	useJUnitPlatform()
}

tasks.register('seedMemberDevelopment', JavaExec) {
	description = 'Seeds a test-only account in the explicitly owned local member app database.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.f106.DIO.diary.qa.MemberDevelopmentFixture'
}

tasks.register('writeMemberDevelopmentArtifact') {
	description = 'Records the exact bootJar output used by the local member development launcher.'
	dependsOn tasks.named('bootJar')
	doLast {
		def manifest = layout.buildDirectory.file('member-development/boot-jar-path.txt').get().asFile
		manifest.parentFile.mkdirs()
		manifest.setText(tasks.named('bootJar').get().archiveFile.get().asFile.absolutePath + '\n', 'UTF-8')
	}
}

tasks.register('postgresMemberDiaryCreationTest', Test) {
	description = 'Runs atomic diary/owner/initial-page creation tests in isolated PostgreSQL schemas.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter {
		includeTestsMatching 'com.f106.DIO.diary.creation.PostgresMemberDiaryCreationTests'
		includeTestsMatching 'com.f106.DIO.diary.creation.PageCatalogPostgresTests'
		includeTestsMatching 'com.f106.DIO.diary.creation.MemberMigrationUpgradePostgresTests'
		includeTestsMatching 'com.f106.DIO.diary.http.MemberDiaryListPostgresTests'
	}
	systemProperty 'dio.diary-creation-postgres', 'true'
}

tasks.register('postgresDiaryDetailTest', Test) {
	description = 'Runs diary metadata permission and conflict tests in isolated PostgreSQL schemas.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter { includeTestsMatching 'com.f106.DIO.diary.detail.PostgresDiaryDetailTests' }
	systemProperty 'dio.diary-detail-postgres', 'true'
}

// 로컬 전용 시드는 파일 시스템에서만 읽는다. JAR 리소스에는 절대 넣지 않는다.
tasks.named('processResources') {
	exclude 'db/seed/**'
}

tasks.register('authPostgresTest', Test) {
	description = 'Verifies auth, password reset and notification SQL using separate disposable databases; requires DIO_AUTH_SCHEMA_TEST_URL/PASSWORD and DIO_RESET_POSTGRES_URL/PASSWORD (see docs/password-reset.md).'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter {
		includeTestsMatching 'com.f106.DIO.auth.integration.AuthInitialSchemaPostgresTests'
		includeTestsMatching 'com.f106.DIO.notification.NotificationPostgresSchemaTests'
		includeTestsMatching 'com.f106.DIO.auth.integration.PasswordResetPostgresTests'
	}
	environment 'DIO_AUTH_SCHEMA_TEST', 'true'
	environment 'DIO_RESET_POSTGRES_QA', 'true'
	doFirst {
		def required = ['DIO_AUTH_SCHEMA_TEST_URL', 'DIO_AUTH_SCHEMA_TEST_PASSWORD',
			'DIO_RESET_POSTGRES_URL', 'DIO_RESET_POSTGRES_PASSWORD']
		def missing = required.findAll { !environment[it]?.toString()?.trim() }
		if (!missing.isEmpty()) {
			throw new GradleException('Missing disposable PostgreSQL test configuration: ' + missing.join(', ')
				+ '. Use separate auth_ci / dio_reset_qa test databases. See docs/password-reset.md (authPostgresTest local setup). No database fallback is allowed.')
		}
	}
}

tasks.register('postgresTest', Test) {
	description = 'Runs diary and page persistence tests against the local PostgreSQL database (test rows rolled back).'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter {
		includeTestsMatching 'com.f106.DIO.diary.PostgresDiary*Tests'
		includeTestsMatching 'com.f106.DIO.page.Postgres*Tests'
	}
	systemProperty 'dio.postgres-test', 'true'
}

// Uses a separate disposable database; never falls back to a developer database.
tasks.register('sharingPostgresTest', Test) {
    description = 'Verifies sharing permissions, concurrency and permanent deletion against dedicated dio_sharing_qa PostgreSQL.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.f106.DIO.sharing.SharingPostgresTests'
        includeTestsMatching 'com.f106.DIO.sharing.UserWithdrawalPostgresTests'
        includeTestsMatching 'com.f106.DIO.sharing.EmailInvitePostgresTests'
        includeTestsMatching 'com.f106.DIO.sharing.DiaryProfilePostgresTests'
        includeTestsMatching 'com.f106.DIO.sharing.SharingReviewPostgresTests'
    }
    environment 'DIO_SHARING_POSTGRES_QA', 'true'
    doFirst {
        def required = ['DIO_SHARING_POSTGRES_URL', 'DIO_SHARING_POSTGRES_PASSWORD']
        if (required.any { !environment[it]?.toString()?.trim() }) {
            throw new GradleException('Explicit DIO_SHARING_POSTGRES_URL/PASSWORD for disposable dio_sharing_qa required. No fallback. See docs/diary-sharing.md.')
        }
    }
}

tasks.register('notificationBrowserQa', JavaExec) {
    group = 'verification'
    description = 'Starts the explicitly opted-in loopback H2 notification browser QA fixture.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.f106.DIO.notification.NotificationBrowserQa'
}


tasks.register('postgresDiaryTrashTest',Test) {
    group='verification'
    description='Runs member trash tests only against explicit disposable dio_trash_qa.'
    testClassesDirs=sourceSets.test.output.classesDirs
    classpath=sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.f106.DIO.diary.trash.*'
        includeTestsMatching 'com.f106.DIO.diary.http.MemberDiaryTrashContractPostgresTests'
    }
    environment 'DIO_MEMBER_TRASH_PG','true'
    outputs.upToDateWhen {false}
    outputs.cacheIf {false}
    doFirst {
        if(environment['DIO_LIST_QUERY_PG']!='true' || !(environment['DB_URL']?.toString()==~/jdbc:postgresql:\/\/127\.0\.0\.1:[0-9]+\/dio_trash_qa/) || !environment['POSTGRES_USER'] || !environment['POSTGRES_PASSWORD'])
            throw new GradleException('Explicit disposable dio_trash_qa and DIO_LIST_QUERY_PG=true required; no fallback.')
    }
}

tasks.register('postgresDiaryPurgeTest',Test) {
    group='verification'
    description='Runs member purge and media physical-delete tests only against explicit disposable dio_trash_qa.'
    testClassesDirs=sourceSets.test.output.classesDirs
    classpath=sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.f106.DIO.diary.purge.*'
        includeTestsMatching 'com.f106.DIO.diary.http.MemberDiaryPurgeContractPostgresTests'
        includeTestsMatching 'com.f106.DIO.media.*PostgresTests'
    }
    environment 'DIO_MEMBER_PURGE_PG','true'
    outputs.upToDateWhen {false}
    outputs.cacheIf {false}
    doFirst {
        if(environment['DIO_LIST_QUERY_PG']!='true' || !(environment['DB_URL']?.toString()==~/jdbc:postgresql:\/\/127\.0\.0\.1:[0-9]+\/dio_trash_qa/) || !environment['POSTGRES_USER'] || !environment['POSTGRES_PASSWORD'])
            throw new GradleException('Explicit disposable dio_trash_qa and DIO_LIST_QUERY_PG=true required; no fallback.')
    }
}

tasks.register('postgresMemberDiaryHttpTest',Test) {
    group='verification'
    description='Runs real member diary HTTP contracts on disposable PostgreSQL only.'
    testClassesDirs=sourceSets.test.output.classesDirs
    classpath=sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {includeTestsMatching 'com.f106.DIO.diary.http.MemberDiaryContractPostgresTests'}
    environment 'DIO_MEMBER_CONTRACT_PG','true'
    outputs.upToDateWhen {false}
    outputs.cacheIf {false}
    doFirst {
        if(!(environment['DB_URL']?.toString()==~/jdbc:postgresql:\/\/127\.0\.0\.1:[0-9]+\/dio_member_contract_qa/) || !environment['POSTGRES_USER'] || !environment['POSTGRES_PASSWORD'])
            throw new GradleException('Explicit disposable dio_member_contract_qa required; no fallback.')
    }
}

// Existing ERD tables only. Never use a developer database for mutation/locking tests.
tasks.register('collaborationPostgresTest', Test) {
    group='verification'
    description='Runs canvas history, concurrency and real WebSocket tests on disposable dio_collaboration_qa.'
    testClassesDirs=sourceSets.test.output.classesDirs
    classpath=sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {includeTestsMatching 'com.f106.DIO.collaboration.CanvasCollaborationPostgresTests'}
    environment 'DIO_COLLABORATION_POSTGRES_QA','true'
    doFirst {
        if(!(environment['DIO_COLLABORATION_POSTGRES_URL']?.toString()==~/jdbc:postgresql:\/\/127\.0\.0\.1:[0-9]+\/dio_collaboration_qa/) || !environment['DIO_COLLABORATION_POSTGRES_PASSWORD'])
            throw new GradleException('Explicit disposable dio_collaboration_qa URL/password required; no fallback.')
    }
}
