        - backend/src/test/java/**/diary/http/MemberDiaryContractPostgresTests.java
        - backend/src/test/java/**/diary/http/MemberDiaryListPostgresTests.java
    # 그 밖의 백엔드·CI 변경은 필요할 때 수동으로 실행한다. 실행하지 않아도 파이프라인을 막지 않는다.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
      when: manual
      allow_failure: true
  script:
    - bash infra/scripts/test-auth-postgres.sh diary
  artifacts:
    when: always
    reports:
      junit:
        - backend/build/test-results/postgresMemberDiaryCreationTest/*.xml
        - backend/build/test-results/postgresDiaryDetailTest/*.xml
        - backend/build/test-results/postgresMemberDiaryHttpTest/*.xml
    paths:
      - backend/build/reports/tests/postgresMemberDiaryCreationTest/
      - backend/build/reports/tests/postgresDiaryDetailTest/
      - backend/build/reports/tests/postgresMemberDiaryHttpTest/
    expire_in: 7 days

backend-postgres-lifecycle-test:
  stage: quality
  needs:
    - job: backend-test
      artifacts: false
      # develop 파이프라인에는 backend-test가 없으므로 선택 의존으로 둔다.
      optional: true
  tags:
    - mr-sandbox
  image: eclipse-temurin:17-jdk
  # 잡마다 새로 뜨는 폐기용 PostgreSQL. 잡 네트워크 안에서만 보이며 실제 dev/prod DB와 접속 정보·볼륨을 공유하지 않는다.
  services:
    - name: postgres:17
      alias: postgres
      command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
  variables:
    POSTGRES_DB: auth_ci
    POSTGRES_PASSWORD: postgres
  cache:
    key: backend-gradle-v1
    paths:
      - backend/.gradle/caches/
      - backend/.gradle/wrapper/
    policy: pull
  interruptible: true
  rules:
    # develop 파이프라인은 변경 경로와 무관하게 배포 전에 항상 실행한다.
    # 앞선 파이프라인이 취소돼도 배포하는 파이프라인이 직접 검증하므로 검증 없이 배포되지 않는다.
    - if: '$CI_COMMIT_BRANCH == "develop"'
    # MR에서는 스키마(Flyway)나 이 묶음이 실행하는 테스트(부모 클래스 포함)가 바뀐 경우에만 자동 실행한다.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/src/main/resources/db/migration/**/*
        - infra/scripts/test-auth-postgres.sh
        - backend/src/test/java/**/support/**/*
        - backend/src/test/java/**/diary/trash/**/*
        - backend/src/test/java/**/diary/purge/**/*
        - backend/src/test/java/**/diary/http/MemberDiaryTrash*.java
        - backend/src/test/java/**/diary/http/MemberDiaryPurge*.java
        - backend/src/test/java/**/media/**/*Postgres*.java
    # 그 밖의 백엔드·CI 변경은 필요할 때 수동으로 실행한다. 실행하지 않아도 파이프라인을 막지 않는다.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
      when: manual
      allow_failure: true
  script:
    - bash infra/scripts/test-auth-postgres.sh lifecycle
  artifacts:
    when: always
    reports:
      junit:
        - backend/build/test-results/postgresDiaryTrashTest/*.xml
        - backend/build/test-results/postgresDiaryPurgeTest/*.xml
    paths:
      - backend/build/reports/tests/postgresDiaryTrashTest/
      - backend/build/reports/tests/postgresDiaryPurgeTest/
    expire_in: 7 days

secret-scan:
  stage: quality
  tags:
    - mr-sandbox
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: [""]
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - gitleaks dir "$CI_PROJECT_DIR" --config "$CI_PROJECT_DIR/.gitleaks.toml" --redact --no-banner

# 커밋된 Firebase Android 클라이언트 설정이 app.json과 맞고 서비스 계정 키가 아닌지 확인한다.
firebase-config-check:
  stage: quality
  tags:
    - mr-sandbox
  image: node@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    # CI 체크아웃에는 Git이 추적하는 파일만 있으므로 파일 존재가 곧 커밋 여부다.
    - test -f frontend/google-services.json || { echo "frontend/google-services.json이 커밋되어 있지 않습니다." >&2; exit 1; }
    - node infra/scripts/verify-firebase-android-config.test.mjs
    - node infra/scripts/verify-firebase-android-config.mjs frontend/google-services.json frontend/app.json

ai-code-review:
