secret-scan:
  stage: quality
  tags:
    - ec2-deploy
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - >
      docker run --rm
      -v "$CI_PROJECT_DIR:/repo:ro"
      ghcr.io/gitleaks/gitleaks:v8.30.1
      dir /repo --redact --no-banner

ai-code-review:
  stage: review
  # 테스트 결과를 쓰지 않으므로 quality 단계를 기다리지 않고 바로 시작한다.
  needs: []
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    GIT_DEPTH: "0"
  interruptible: true
  timeout: 15m
  allow_failure: true
  script:
    - bash infra/review/mr-review.sh

backend-postgres-push-test:
  stage: quality
  needs:
    - job: backend-test
      artifacts: false
      optional: true
  tags:
    - ec2-deploy
  cache:
    key: backend-gradle-v1
    paths:
      - backend/.gradle/caches/
      - backend/.gradle/wrapper/
    policy: pull
  interruptible: true
  rules:
    # MR 변경 스크립트를 배포 호스트에서 실행하지 않는다.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - .gitlab-ci.yml
        - infra/scripts/test-push-postgres.sh
        - backend/build.gradle
        - backend/settings.gradle
        - backend/gradle/**/*
        - backend/src/main/resources/db/migration/**/*
        - backend/src/main/resources/application*.yml
        - backend/src/test/resources/push*/**/*
        - backend/src/test/resources/push-session-h2.sql
        - backend/src/main/java/**/push/**/*
        - backend/src/test/java/**/push/**/*
        - backend/src/main/java/**/auth/**/*
        - backend/src/main/java/**/user/**/*
        - backend/src/test/java/**/auth/**/*
  script:
    - bash infra/scripts/test-push-postgres.sh
  artifacts:
    when: always
    reports:
      junit:
        - backend/build/test-results/pushPostgresTest/*.xml
    paths:
      - backend/build/reports/tests/pushPostgresTest/
    expire_in: 7 days
