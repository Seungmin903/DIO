stages:
  - check
  - quality
  - review
  - deploy
  - edge

runner-check:
  stage: check
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - whoami
    - docker --version
    - docker ps

deploy-development:
  stage: deploy
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  resource_group: development
  environment:
    name: development
  script:
    - export BACKEND_IMAGE="dio-backend:dev-${CI_COMMIT_SHORT_SHA}"
    # 필수 인증·SMTP·프록시 환경변수 누락 시 이미지 빌드/컨테이너 교체 전에 중단한다.
    - docker compose --project-name dio-dev-backend --env-file /home/gitlab-runner/dio-env/dev.env -f infra/compose/compose.dev.yml config --quiet
    - docker build --tag "dio-backend:dev-${CI_COMMIT_SHORT_SHA}" ./backend
    - docker compose --project-name dio-dev-backend --env-file /home/gitlab-runner/dio-env/dev.env -f infra/compose/compose.dev.yml up -d --force-recreate
    - curl --fail --retry 12 --retry-all-errors --retry-delay 2 http://127.0.0.1:8081/actuator/health

deploy-production:
  stage: deploy
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
  resource_group: production
  environment:
    name: production
  script:
    - bash infra/scripts/assert-flyway-initial-state.sh app-db-1
    - export BACKEND_IMAGE="dio-backend:prod-${CI_COMMIT_SHORT_SHA}"
    # 필수 인증·SMTP·프록시 환경변수 누락 시 이미지 빌드/컨테이너 교체 전에 중단한다.
    - docker compose --project-name dio-prod-backend --env-file /home/gitlab-runner/dio-env/prod.env -f infra/compose/compose.prod.yml config --quiet
    - docker build --tag "dio-backend:prod-${CI_COMMIT_SHORT_SHA}" ./backend
    - docker compose --project-name dio-prod-backend --env-file /home/gitlab-runner/dio-env/prod.env -f infra/compose/compose.prod.yml up -d --force-recreate
    - curl --fail --retry 12 --retry-all-errors --retry-delay 2 http://127.0.0.1:8082/actuator/health

deploy-dev-proxy:
  stage: edge
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - infra/nginx/dev/**/*
        - infra/compose/compose.proxy.dev.yml
  resource_group: development-edge
  script:
    - docker build --tag "dio-nginx-dev:${CI_COMMIT_SHORT_SHA}" ./infra/nginx/dev
    - export NGINX_DEV_IMAGE="dio-nginx-dev:${CI_COMMIT_SHORT_SHA}"
    - docker compose --project-name dio-proxy-dev -f infra/compose/compose.proxy.dev.yml run --rm --no-deps nginx-dev nginx -t
    - docker compose --project-name dio-proxy-dev -f infra/compose/compose.proxy.dev.yml up -d --force-recreate

deploy-prod-proxy:
  stage: edge
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
      changes:
        - infra/nginx/prod/**/*
        - infra/compose/compose.proxy.prod.yml
  resource_group: production-edge
  script:
    - docker build --tag "dio-nginx-prod:${CI_COMMIT_SHORT_SHA}" ./infra/nginx/prod
    - export NGINX_PROD_IMAGE="dio-nginx-prod:${CI_COMMIT_SHORT_SHA}"
    - docker compose --project-name dio-proxy-prod -f infra/compose/compose.proxy.prod.yml run --rm --no-deps nginx-prod nginx -t
    - docker compose --project-name dio-proxy-prod -f infra/compose/compose.proxy.prod.yml up -d --force-recreate
    - 'curl --fail --retry 12 --retry-all-errors --retry-delay 2 --resolve k15f106.p.ssafy.io:443:127.0.0.1 https://k15f106.p.ssafy.io/actuator/health'

backend-test:
  stage: quality
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
        - infra/compose/compose.*.yml
        - infra/nginx/**/default.conf
        - infra/scripts/test-auth-postgres.sh
        - frontend/src/notifications/**/*
        - frontend/tests/*notification*
        - frontend/qa/run-notification-contract.*
        - frontend/package.json
        - frontend/pnpm-lock.yaml
        - frontend/src/diary/**/*
        - frontend/src/auth/**/*
        - frontend/src/shared/theme.js
        - frontend/src/editor/components/controls/ConfirmDialog.js
        - frontend/tests/*diary*
        - frontend/tests/library-reader.test.js
        - frontend/qa/run-diary-contract.cjs
        - infra/scripts/test-diary-postgres.sh
  before_script:
    - mkdir -p backend/build/diary-contract
    - >
      rm -f backend/build/diary-contract/diary-read.json backend/build/diary-contract/diary-create.json
      backend/build/diary-contract/diary-update.json backend/build/diary-contract/diary-trash.json
      backend/build/diary-contract/diary-restore.json backend/build/diary-contract/diary-purge.json backend/build/diary-contract/fe-junit.xml
  script:
    - >
      docker run --rm
      --user "$(id -u):$(id -g)"
      -e GRADLE_USER_HOME=/tmp/gradle
      -e DIO_NOTIFICATION_CONTRACT_OUTPUT=/workspace/backend/build/notification-frontend-contract.json
      -e DIO_DIARY_CONTRACT_OUTPUT=/workspace/backend/build/diary-contract/diary-read.json
      -e DIO_DIARY_CREATE_CONTRACT_OUTPUT=/workspace/backend/build/diary-contract/diary-create.json
      -e DIO_DIARY_UPDATE_CONTRACT_OUTPUT=/workspace/backend/build/diary-contract/diary-update.json
      -e DIO_DIARY_TRASH_CONTRACT_OUTPUT=/workspace/backend/build/diary-contract/diary-trash.json
      -e DIO_DIARY_RESTORE_CONTRACT_OUTPUT=/workspace/backend/build/diary-contract/diary-restore.json
      -e DIO_DIARY_PURGE_CONTRACT_OUTPUT=/workspace/backend/build/diary-contract/diary-purge.json
      -v "$CI_PROJECT_DIR/backend:/workspace/backend"
      -v "$CI_PROJECT_DIR/infra:/workspace/infra:ro"
      -v "$CI_PROJECT_DIR/.gitlab-ci.yml:/workspace/.gitlab-ci.yml:ro"
      -w /workspace/backend
      eclipse-temurin:17-jdk
      sh ./gradlew test --no-daemon
    - >
      docker run --rm
      --user "$(id -u):$(id -g)"
      -e DIO_NOTIFICATION_CONTRACT_OUTPUT=/evidence/notification-frontend-contract.json
      -v "$CI_PROJECT_DIR/frontend:/workspace/frontend:ro"
      -v "$CI_PROJECT_DIR/backend/build:/evidence:ro"
      -w /workspace/frontend
      node:24-alpine
      node --test tests/spring-notification-contract.test.js
  artifacts:
    when: always
    reports:
      junit: backend/build/test-results/test/*.xml
    paths:
      - backend/build/reports/tests/test/
      - backend/build/diary-contract/
    expire_in: 7 days

backend-postgres-test:
  stage: quality
  needs:
    - job: backend-test
      artifacts: false
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
        - infra/scripts/test-auth-postgres.sh
  script:
    - bash infra/scripts/test-auth-postgres.sh
  artifacts:
    when: always
    reports:
      junit: backend/build/test-results/authPostgresTest/*.xml
    paths:
      - backend/build/reports/tests/authPostgresTest/
    expire_in: 7 days

secret-scan:
  stage: quality
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - >
      docker run --rm
      -v "$CI_PROJECT_DIR:/repo:ro"
      ghcr.io/gitleaks/gitleaks:v8.30.1
      dir /repo --redact --no-banner

ai-code-review:
  stage: review
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    GIT_DEPTH: "0"
  interruptible: true
  timeout: 15m
  allow_failure: true
  script:
    - bash infra/review/mr-review.sh

# Independent from auth PostgreSQL fixtures; no shared database or host port.
diary-postgres-test:
  stage: quality
  needs:
    - job: backend-test
      artifacts: false
    - job: backend-postgres-test
      artifacts: false
      optional: true
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
        - infra/scripts/test-diary-postgres.sh
  script:
    - bash infra/scripts/test-diary-postgres.sh
  artifacts:
    when: always
    reports:
      junit: backend/build/test-results/diaryPostgresTest/*.xml
    paths:
      - backend/build/reports/tests/diaryPostgresTest/
    expire_in: 7 days

diary-fe-contract-test:
  stage: quality
  needs:
    - job: backend-test
      artifacts: true
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - frontend/package.json
        - frontend/pnpm-lock.yaml
        - frontend/src/diary/**/*
        - frontend/src/auth/**/*
        - frontend/src/shared/theme.js
        - frontend/src/editor/components/controls/ConfirmDialog.js
        - frontend/tests/*diary*
        - frontend/tests/library-reader.test.js
        - frontend/qa/run-diary-contract.cjs
        - .gitlab-ci.yml
        - infra/scripts/test-diary-postgres.sh
  script:
    - >
      docker run --rm --user "$(id -u):$(id -g)"
      -v "$CI_PROJECT_DIR/frontend:/workspace/frontend:ro"
      -v "$CI_PROJECT_DIR/backend/build:/evidence"
      -w /workspace/frontend node:24-alpine
      node qa/run-diary-contract.cjs --contract-root /evidence/diary-contract
      --junit /evidence/diary-contract/fe-junit.xml
  artifacts:
    when: always
    reports:
      junit: backend/build/diary-contract/fe-junit.xml
    expire_in: 7 days
