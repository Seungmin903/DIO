stages:
  - check
  - deploy

runner-check:
  stage: check
  tags:
    - ec2-deploy
  script:
    - whoami
    - docker --version
    - docker ps

deploy-development:
  stage: deploy
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  resource_group: development
  environment:
    name: development
  script:
    - docker build --tag "dio-backend:dev-${CI_COMMIT_SHORT_SHA}" ./backend
    - export BACKEND_IMAGE="dio-backend:dev-${CI_COMMIT_SHORT_SHA}"
    - docker compose --project-name dio-dev-backend --env-file /home/gitlab-runner/dio-env/dev.env -f infra/compose/compose.dev.yml config --quiet
    - docker compose --project-name dio-dev-backend --env-file /home/gitlab-runner/dio-env/dev.env -f infra/compose/compose.dev.yml up -d --force-recreate
    - curl --fail --retry 12 --retry-all-errors --retry-delay 2 http://127.0.0.1:8081/actuator/health
