    - bash infra/scripts/test-auth-postgres.sh lifecycle
  artifacts:
    when: always
    reports:
      junit:
        - backend/build/test-results/postgresDiaryTrashTest/*.xml
        - backend/build/test-results/postgresDiaryPurgeTest/*.xml
    paths:
      - backend/build/reports/tests/postgresDiaryTrashTest/
      - backend/build/reports/tests/postgresDiaryPurgeTest/
    expire_in: 7 days

secret-scan:
  stage: quality
  tags:
    - ec2-deploy
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - >
      docker run --rm
      -v "$CI_PROJECT_DIR:/repo:ro"
      ghcr.io/gitleaks/gitleaks:v8.30.1
      dir /repo --redact --no-banner

ai-code-review:
  stage: review
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    GIT_DEPTH: "0"
  interruptible: true
  timeout: 15m
  allow_failure: true
  script:
    - bash infra/review/mr-review.sh
