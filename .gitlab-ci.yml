# 배포 뒤 backend /actuator/health 확인 대기. dev 잡과 운영 infra/scripts/up-backend-with-rollback.sh가 함께 쓴다.
# 새 마이그레이션이 있으면 기동이 30초를 넘기기도 해 2초 간격 60번(약 2분)까지 기다린다.
variables:
  HEALTH_RETRIES: "60"
  HEALTH_RETRY_DELAY: "2"

stages:
  - check
  - quality
  - review
  - deploy
  - edge

runner-check:
  stage: check
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - whoami
    - docker --version
    - docker ps

deploy-development:
  stage: deploy
  tags:
    - ec2-deploy
  variables:
    # release 검증의 develop과의 migration 비교는 얕은 clone에 의존하지 않는다.
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
  resource_group: development
  environment:
    name: development
  script:
    # release 검증은 dev DB의 Flyway 이력을 공유하므로 양쪽 migration 집합이 같아야 한다.
    - >
      if printf '%s' "$CI_COMMIT_BRANCH" | grep -Eq '^release/'; then
        if ! git fetch --no-tags origin +refs/heads/develop:refs/remotes/origin/develop; then
          echo "Cannot fetch the current origin/develop for the shared-DB migration check." >&2;
          exit 1;
        fi;
        bash infra/scripts/assert-shared-db-migrations.sh origin/develop HEAD;
      fi
    - export BACKEND_IMAGE="dio-backend:dev-${CI_COMMIT_SHORT_SHA}"
    - export AI_IMAGE="dio-ai:dev-${CI_COMMIT_SHORT_SHA}"
    # 필수 인증·SMTP·프록시·AI 내부 키 환경변수 누락 시 이미지 빌드/컨테이너 교체 전에 중단한다.
    # 옛 SIGNUP_PHOTO_* 저장소 변수는 더 이상 읽지 않으므로 남아 있으면 배포 전에 중단한다.
    - bash infra/scripts/assert-no-legacy-photo-env.sh /home/gitlab-runner/dio-env/dev.env
    - docker compose --project-name dio-dev-backend --env-file /home/gitlab-runner/dio-env/dev.env -f infra/compose/compose.dev.yml config --quiet
    - docker build --tag "dio-backend:dev-${CI_COMMIT_SHORT_SHA}" ./backend
    # AI 이미지는 의존성·모델 레이어가 캐시되어 ai/app만 바뀌면 빠르게 끝난다.
    - docker build --tag "dio-ai:dev-${CI_COMMIT_SHORT_SHA}" ./ai
    # backend health 대기는 맨 위 HEALTH_RETRIES · HEALTH_RETRY_DELAY를 쓴다(운영 롤백 스크립트와 같은 값).
    - >
      if ! docker compose --project-name dio-dev-backend --env-file /home/gitlab-runner/dio-env/dev.env -f infra/compose/compose.dev.yml up -d --force-recreate ||
         ! curl --fail --retry "$HEALTH_RETRIES" --retry-all-errors --retry-delay "$HEALTH_RETRY_DELAY" http://127.0.0.1:8081/actuator/health; then
        docker compose --project-name dio-dev-backend --env-file /home/gitlab-runner/dio-env/dev.env -f infra/compose/compose.dev.yml logs --tail=200 backend || true;
        exit 1;
      fi
    # AI는 모델 로딩 뒤 healthy가 된다. 3분 안에 healthy가 아니면 로그를 남기고 실패한다.
    - >
      AI_CONTAINER="$(docker compose --project-name dio-dev-backend --env-file /home/gitlab-runner/dio-env/dev.env -f infra/compose/compose.dev.yml ps -q ai)";
      if ! timeout 180 sh -c "until [ \"\$(docker inspect -f '{{.State.Health.Status}}' $AI_CONTAINER)\" = healthy ]; do sleep 3; done"; then
        docker logs --tail=200 "$AI_CONTAINER" || true;
        exit 1;
      fi

deploy-production:
  stage: deploy
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
  resource_group: production
  environment:
    name: production
  script:
    - bash infra/scripts/assert-flyway-initial-state.sh app-db-1
    - export BACKEND_IMAGE="dio-backend:prod-${CI_COMMIT_SHORT_SHA}"
    # AI 이미지 태그는 커밋이 아니라 ai/ 폴더 내용(git tree 해시)으로 정한다.
    # ai/가 그대로면 태그가 같아 빌드를 건너뛰고 컨테이너도 재생성하지 않는다(모델 재로딩·임베딩 캐시 손실·빌드 메모리 없음).
    - export AI_IMAGE="dio-ai:prod-$(git rev-parse --short=12 HEAD:ai)"
    # 필수 인증·SMTP·프록시·AI 내부 키 환경변수 누락 시 이미지 빌드/컨테이너 교체 전에 중단한다.
    # 옛 SIGNUP_PHOTO_* 저장소 변수는 더 이상 읽지 않으므로 남아 있으면 배포 전에 중단한다.
    - bash infra/scripts/assert-no-legacy-photo-env.sh /home/gitlab-runner/dio-env/prod.env
    - docker compose --project-name dio-prod-backend --env-file /home/gitlab-runner/dio-env/prod.env -f infra/compose/compose.prod.yml config --quiet
    - docker build --tag "dio-backend:prod-${CI_COMMIT_SHORT_SHA}" ./backend
    # 같은 ai/ 내용의 이미지가 이미 있으면 빌드하지 않는다. 바뀌었을 때도 의존성·모델 레이어는 캐시된다.
    - docker image inspect "$AI_IMAGE" >/dev/null 2>&1 || docker build --tag "$AI_IMAGE" ./ai
    # AI를 먼저 올리고 healthy(모델 로딩 완료, ai/Dockerfile HEALTHCHECK)를 확인한 뒤에만 backend를 교체한다.
    # --force-recreate를 쓰지 않아 이미지·설정이 같으면 기존 AI 컨테이너를 그대로 둔다(이미 healthy라 대기도 바로 끝난다).
    # 롤백 기준은 마지막으로 배포 전체가 성공한 이미지(dio-backend·dio-ai:prod-last-good)다. 같은 커밋 재시도에도 쓸 수 있다.
    # AI가 3분 안에 healthy가 아니거나 종료되면 로그를 남기고 마지막 정상 AI로 되돌린 뒤 실패한다(backend는 교체하지 않음).
    - bash infra/scripts/up-ai-with-rollback.sh dio-prod-backend /home/gitlab-runner/dio-env/prod.env infra/compose/compose.prod.yml 180
    # backend가 정상 응답하지 않으면 backend와 AI를 마지막 정상 배포로 함께 되돌린 뒤 실패한다. 성공하면 prod-last-good을 갱신한다.
    # Flyway가 적용한 스키마는 되돌아가지 않으므로 이전 backend와 호환되는 마이그레이션만 이 롤백에 기댄다.
    - bash infra/scripts/up-backend-with-rollback.sh dio-prod-backend /home/gitlab-runner/dio-env/prod.env infra/compose/compose.prod.yml http://127.0.0.1:8082/actuator/health

deploy-dev-proxy:
  stage: edge
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - infra/nginx/dev/**/*
        - infra/compose/compose.proxy.dev.yml
  resource_group: development-edge
  script:
    - docker build --tag "dio-nginx-dev:${CI_COMMIT_SHORT_SHA}" ./infra/nginx/dev
    - export NGINX_DEV_IMAGE="dio-nginx-dev:${CI_COMMIT_SHORT_SHA}"
    - docker compose --project-name dio-proxy-dev -f infra/compose/compose.proxy.dev.yml run --rm --no-deps nginx-dev nginx -t
    - docker compose --project-name dio-proxy-dev -f infra/compose/compose.proxy.dev.yml up -d --force-recreate

deploy-prod-proxy:
  stage: edge
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
      changes:
        - infra/nginx/prod/**/*
        - infra/compose/compose.proxy.prod.yml
  resource_group: production-edge
  script:
    - docker build --tag "dio-nginx-prod:${CI_COMMIT_SHORT_SHA}" ./infra/nginx/prod
    - export NGINX_PROD_IMAGE="dio-nginx-prod:${CI_COMMIT_SHORT_SHA}"
    - docker compose --project-name dio-proxy-prod -f infra/compose/compose.proxy.prod.yml run --rm --no-deps nginx-prod nginx -t
    - docker compose --project-name dio-proxy-prod -f infra/compose/compose.proxy.prod.yml up -d --force-recreate
    - 'curl --fail --retry 12 --retry-all-errors --retry-delay 2 --resolve k15f106.p.ssafy.io:443:127.0.0.1 https://k15f106.p.ssafy.io/actuator/health'

# ---------- MR 검사 잡 ----------
# MR 파이프라인은 MR 브랜치의 .gitlab-ci.yml과 스크립트를 그대로 실행한다. 그래서 MR이 닿을 수 있는 잡은
# 배포 호스트의 docker·dio-env에 접근할 수 없는 mr-sandbox 러너(docker executor, 호스트 docker 소켓 없음)에서
# 잡 이미지로 직접 실행한다. ec2-deploy 러너는 보호 브랜치 전용(Protected)이며 배포·운영 검증 잡만 맡는다.
# 러너 등록·설정: infra/ci-runners.md

legal-document-test:
  stage: quality
  tags:
    - mr-sandbox
  image: python:3.12-alpine
  variables:
    PYTHONDONTWRITEBYTECODE: "1"
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "develop"'
      changes:
        - docs/legal/**/*
        - frontend/src/shared/legalContent.json
        - frontend/src/auth/signupPolicy.js
        - backend/src/main/resources/application.yml
        - infra/compose/*.env.example
        - .gitlab-ci.yml
  script:
    - python -m unittest discover -s docs/legal/tests -v

# Pure Node contract tests: no dependency installation, native modules, or deployment secrets.
frontend-email-contract-test:
  stage: quality
  tags:
    - mr-sandbox
  image: node:24-alpine
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "develop"'
      changes:
        - docs/contracts/**/*
        - frontend/src/shared/emailInput.js
        - frontend/src/auth/validation.js
        - frontend/src/auth/authApi.js
        - frontend/src/auth/signupPolicy.js
        - frontend/src/auth/developmentAccess.js
        - frontend/src/sharing/sharingContracts.js
        - frontend/tests/email-input.test.js
        - backend/src/main/java/com/f106/DIO/user/support/UserInput.java
        - backend/src/main/java/com/f106/DIO/auth/dto/**/*
        - .gitlab-ci.yml
  script:
    - cd frontend
    - node --test tests/email-input.test.js

backend-test:
  stage: quality
  tags:
    - mr-sandbox
  image: eclipse-temurin:17-jdk
  variables:
    JAVA_TOOL_OPTIONS: "-Xmx2g"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/backend/.gradle"
    DIO_NOTIFICATION_CONTRACT_OUTPUT: "$CI_PROJECT_DIR/backend/build/notification-frontend-contract.json"
  cache:
    key: backend-gradle-v1
    paths:
      - backend/.gradle/caches/
      - backend/.gradle/wrapper/
    policy: pull-push
  interruptible: true
  rules: &backend_test_rules
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      # 백엔드 산출물을 만드는 작업이므로 프런트엔드 전용 변경에서는 실행하지 않는다.
      changes:
        - backend/**/*
        - docs/contracts/**/*
        - .gitlab-ci.yml
        - infra/compose/compose.*.yml
        - infra/nginx/**/default.conf
        - infra/scripts/test-auth-postgres.sh
        - infra/scripts/check-member-list-icu.sh
  script:
    - cd backend
    - sh ./gradlew test --no-daemon
  artifacts:
    when: always
    reports:
      junit: backend/build/test-results/test/*.xml
    paths:
      - backend/build/reports/tests/test/
      - backend/build/contracts/
      - backend/build/notification-frontend-contract.json
    expire_in: 7 days

# backend-test가 남긴 Spring 알림 OpenAPI로 프런트 알림 요청을 검사한다.
notification-contract-test:
  stage: quality
  needs:
    - job: backend-test
      artifacts: true
  tags:
    - mr-sandbox
  image: node:24-alpine
  variables:
    DIO_NOTIFICATION_CONTRACT_OUTPUT: "$CI_PROJECT_DIR/backend/build/notification-frontend-contract.json"
  interruptible: true
  rules: *backend_test_rules
  script:
    - cd frontend
    - node --test tests/spring-notification-contract.test.js

release-migration-guard-test:
  stage: quality
  tags:
    - mr-sandbox
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .gitlab-ci.yml
        - infra/scripts/assert-shared-db-migrations.sh
        - infra/scripts/test-assert-shared-db-migrations.sh
  script:
    - apk add --no-cache bash git >/dev/null
    - bash infra/scripts/test-assert-shared-db-migrations.sh

# PostgreSQL 잡: MR에서는 스키마·해당 테스트 변경에만 자동 실행하고 나머지는 수동, develop 파이프라인에서는 배포 전에 항상 실행한다.
backend-postgres-auth-test:
  stage: quality
  needs:
    - job: backend-test
      artifacts: false
      # develop 파이프라인에는 backend-test가 없으므로 선택 의존으로 둔다.
      optional: true
  tags:
    - mr-sandbox
  image: eclipse-temurin:17-jdk
  # 잡마다 새로 뜨는 폐기용 PostgreSQL. 잡 네트워크 안에서만 보이며 실제 dev/prod DB와 접속 정보·볼륨을 공유하지 않는다.
  services:
    - name: postgres:17
      alias: postgres
      command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
  variables:
    POSTGRES_DB: auth_ci
    POSTGRES_PASSWORD: postgres
  cache:
    key: backend-gradle-v1
    paths:
      - backend/.gradle/caches/
      - backend/.gradle/wrapper/
    policy: pull
  interruptible: true
  rules:
    # develop 파이프라인은 변경 경로와 무관하게 배포 전에 항상 실행한다.
    # 앞선 파이프라인이 취소돼도 배포하는 파이프라인이 직접 검증하므로 검증 없이 배포되지 않는다.
    - if: '$CI_COMMIT_BRANCH == "develop"'
    # MR에서는 스키마(Flyway)나 이 묶음이 실행하는 테스트(부모 클래스 포함)가 바뀐 경우에만 자동 실행한다.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/src/main/resources/db/migration/**/*
        - infra/scripts/test-auth-postgres.sh
        - backend/src/test/java/**/auth/**/*Postgres*.java
        - backend/src/test/java/**/auth/integration/PasswordResetTests.java
        - backend/src/test/java/**/notification/**/*Postgres*.java
    # 그 밖의 백엔드·CI 변경은 필요할 때 수동으로 실행한다. 실행하지 않아도 파이프라인을 막지 않는다.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
      when: manual
      allow_failure: true
  script:
    - bash infra/scripts/test-auth-postgres.sh auth
  artifacts:
    when: always
    reports:
      junit:
        - backend/build/test-results/authPostgresTest/*.xml
    paths:
      - backend/build/reports/tests/authPostgresTest/
    expire_in: 7 days

backend-postgres-sharing-test:
  stage: quality
  needs:
    - job: backend-test
      artifacts: false
      # develop 파이프라인에는 backend-test가 없으므로 선택 의존으로 둔다.
      optional: true
  tags:
    - mr-sandbox
  image: eclipse-temurin:17-jdk
  # 잡마다 새로 뜨는 폐기용 PostgreSQL. 잡 네트워크 안에서만 보이며 실제 dev/prod DB와 접속 정보·볼륨을 공유하지 않는다.
  services:
    - name: postgres:17
      alias: postgres
      command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
  variables:
    POSTGRES_DB: auth_ci
    POSTGRES_PASSWORD: postgres
  cache:
    key: backend-gradle-v1
    paths:
      - backend/.gradle/caches/
      - backend/.gradle/wrapper/
    policy: pull
  interruptible: true
  rules:
    # develop 파이프라인은 변경 경로와 무관하게 배포 전에 항상 실행한다.
    # 앞선 파이프라인이 취소돼도 배포하는 파이프라인이 직접 검증하므로 검증 없이 배포되지 않는다.
    - if: '$CI_COMMIT_BRANCH == "develop"'
    # MR에서는 스키마(Flyway)나 이 묶음이 실행하는 테스트(부모 클래스 포함)가 바뀐 경우에만 자동 실행한다.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/src/main/resources/db/migration/**/*
        - infra/scripts/test-auth-postgres.sh
        - backend/src/test/java/**/sharing/**/*
        - backend/src/test/java/**/collaboration/**/*
    # 그 밖의 백엔드·CI 변경은 필요할 때 수동으로 실행한다. 실행하지 않아도 파이프라인을 막지 않는다.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
      when: manual
      allow_failure: true
  script:
    - bash infra/scripts/test-auth-postgres.sh sharing
  artifacts:
    when: always
    reports:
      junit:
        - backend/build/test-results/sharingPostgresTest/*.xml
        - backend/build/test-results/collaborationPostgresTest/*.xml
    paths:
      - backend/build/reports/tests/sharingPostgresTest/
      - backend/build/reports/tests/collaborationPostgresTest/
    expire_in: 7 days

backend-postgres-diary-test:
  stage: quality
