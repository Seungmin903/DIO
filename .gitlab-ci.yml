stages:
  - check
  - quality
  - review
  - deploy
  - edge

runner-check:
  stage: check
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - whoami
    - docker --version
    - docker ps

deploy-development:
  stage: deploy
  tags:
    - ec2-deploy
  variables:
    # release 검증의 develop과의 migration 비교는 얕은 clone에 의존하지 않는다.
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
  resource_group: development
  environment:
    name: development
  script:
    # release 검증은 dev DB의 Flyway 이력을 공유하므로 양쪽 migration 집합이 같아야 한다.
    - >
      if printf '%s' "$CI_COMMIT_BRANCH" | grep -Eq '^release/'; then
        if ! git fetch --no-tags origin +refs/heads/develop:refs/remotes/origin/develop; then
          echo "Cannot fetch the current origin/develop for the shared-DB migration check." >&2;
          exit 1;
        fi;
        bash infra/scripts/assert-shared-db-migrations.sh origin/develop HEAD;
      fi
    - export BACKEND_IMAGE="dio-backend:dev-${CI_COMMIT_SHORT_SHA}"
    # 필수 인증·SMTP·프록시 환경변수 누락 시 이미지 빌드/컨테이너 교체 전에 중단한다.
    # 옛 SIGNUP_PHOTO_* 저장소 변수는 더 이상 읽지 않으므로 남아 있으면 배포 전에 중단한다.
    - bash infra/scripts/assert-no-legacy-photo-env.sh /home/gitlab-runner/dio-env/dev.env
    - docker compose --project-name dio-dev-backend --env-file /home/gitlab-runner/dio-env/dev.env -f infra/compose/compose.dev.yml config --quiet
    - docker build --tag "dio-backend:dev-${CI_COMMIT_SHORT_SHA}" ./backend
    - >
      if ! docker compose --project-name dio-dev-backend --env-file /home/gitlab-runner/dio-env/dev.env -f infra/compose/compose.dev.yml up -d --force-recreate ||
         ! curl --fail --retry 12 --retry-all-errors --retry-delay 2 http://127.0.0.1:8081/actuator/health; then
        docker compose --project-name dio-dev-backend --env-file /home/gitlab-runner/dio-env/dev.env -f infra/compose/compose.dev.yml logs --tail=200 backend || true;
        exit 1;
      fi

deploy-production:
  stage: deploy
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
  resource_group: production
  environment:
    name: production
  script:
    - bash infra/scripts/assert-flyway-initial-state.sh app-db-1
    - export BACKEND_IMAGE="dio-backend:prod-${CI_COMMIT_SHORT_SHA}"
    # 필수 인증·SMTP·프록시 환경변수 누락 시 이미지 빌드/컨테이너 교체 전에 중단한다.
    # 옛 SIGNUP_PHOTO_* 저장소 변수는 더 이상 읽지 않으므로 남아 있으면 배포 전에 중단한다.
    - bash infra/scripts/assert-no-legacy-photo-env.sh /home/gitlab-runner/dio-env/prod.env
    - docker compose --project-name dio-prod-backend --env-file /home/gitlab-runner/dio-env/prod.env -f infra/compose/compose.prod.yml config --quiet
    - docker build --tag "dio-backend:prod-${CI_COMMIT_SHORT_SHA}" ./backend
    - docker compose --project-name dio-prod-backend --env-file /home/gitlab-runner/dio-env/prod.env -f infra/compose/compose.prod.yml up -d --force-recreate
    - curl --fail --retry 12 --retry-all-errors --retry-delay 2 http://127.0.0.1:8082/actuator/health

deploy-dev-proxy:
  stage: edge
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - infra/nginx/dev/**/*
        - infra/compose/compose.proxy.dev.yml
  resource_group: development-edge
  script:
    - docker build --tag "dio-nginx-dev:${CI_COMMIT_SHORT_SHA}" ./infra/nginx/dev
    - export NGINX_DEV_IMAGE="dio-nginx-dev:${CI_COMMIT_SHORT_SHA}"
    - docker compose --project-name dio-proxy-dev -f infra/compose/compose.proxy.dev.yml run --rm --no-deps nginx-dev nginx -t
    - docker compose --project-name dio-proxy-dev -f infra/compose/compose.proxy.dev.yml up -d --force-recreate

deploy-prod-proxy:
  stage: edge
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
      changes:
        - infra/nginx/prod/**/*
        - infra/compose/compose.proxy.prod.yml
  resource_group: production-edge
  script:
    - docker build --tag "dio-nginx-prod:${CI_COMMIT_SHORT_SHA}" ./infra/nginx/prod
    - export NGINX_PROD_IMAGE="dio-nginx-prod:${CI_COMMIT_SHORT_SHA}"
    - docker compose --project-name dio-proxy-prod -f infra/compose/compose.proxy.prod.yml run --rm --no-deps nginx-prod nginx -t
    - docker compose --project-name dio-proxy-prod -f infra/compose/compose.proxy.prod.yml up -d --force-recreate
    - 'curl --fail --retry 12 --retry-all-errors --retry-delay 2 --resolve k15f106.p.ssafy.io:443:127.0.0.1 https://k15f106.p.ssafy.io/actuator/health'

legal-document-test:
  stage: quality
  tags:
    - ec2-deploy
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "develop"'
      changes:
        - docs/legal/**/*
        - frontend/src/shared/legalContent.json
        - frontend/src/auth/signupPolicy.js
        - backend/src/main/resources/application.yml
        - infra/compose/*.env.example
        - .gitlab-ci.yml
  script:
    - >
      docker run --rm
      --user "$(id -u):$(id -g)"
      -e PYTHONDONTWRITEBYTECODE=1
      -v "$CI_PROJECT_DIR:/workspace:ro"
      -w /workspace
      python:3.12-alpine
      python -m unittest discover -s docs/legal/tests -v

# Pure Node contract tests: no dependency installation, native modules, or deployment secrets.
frontend-email-contract-test:
  stage: quality
  tags:
    - ec2-deploy
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "develop"'
      changes:
        - docs/contracts/**/*
        - frontend/src/shared/emailInput.js
        - frontend/src/auth/validation.js
        - frontend/src/auth/authApi.js
        - frontend/src/auth/signupPolicy.js
        - frontend/src/auth/developmentAccess.js
        - frontend/src/sharing/sharingContracts.js
        - frontend/tests/email-input.test.js
        - backend/src/main/java/com/f106/DIO/user/support/UserInput.java
        - backend/src/main/java/com/f106/DIO/auth/dto/**/*
        - .gitlab-ci.yml
  script:
    - >
      docker run --rm
      --user "$(id -u):$(id -g)"
      -v "$CI_PROJECT_DIR/frontend:/workspace/frontend:ro"
      -v "$CI_PROJECT_DIR/docs/contracts:/workspace/docs/contracts:ro"
      -w /workspace/frontend
      node:24-alpine
      node --test tests/email-input.test.js

backend-test:
  stage: quality
  tags:
    - ec2-deploy
  cache:
    key: backend-gradle-v1
    paths:
      - backend/.gradle/caches/
      - backend/.gradle/wrapper/
    policy: pull-push
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      # 백엔드 산출물을 만드는 작업이므로 프런트엔드 전용 변경에서는 실행하지 않는다.
      changes: &backend_contract_changes
        - backend/**/*
        - docs/contracts/**/*
        - .gitlab-ci.yml
        - infra/compose/compose.*.yml
        - infra/nginx/**/default.conf
        - infra/scripts/test-auth-postgres.sh
        - infra/scripts/check-member-list-icu.sh
  script:
    - >
      docker run --rm
      --user "$(id -u):$(id -g)"
      -e JAVA_TOOL_OPTIONS=-Xmx2g
      -e GRADLE_USER_HOME=/workspace/backend/.gradle
      -e DIO_NOTIFICATION_CONTRACT_OUTPUT=/workspace/backend/build/notification-frontend-contract.json
      -v "$CI_PROJECT_DIR/backend:/workspace/backend"
      -v "$CI_PROJECT_DIR/docs/contracts:/workspace/docs/contracts:ro"
      -v "$CI_PROJECT_DIR/infra:/workspace/infra:ro"
      -v "$CI_PROJECT_DIR/frontend/assets/fonts/gowundodum:/workspace/frontend/assets/fonts/gowundodum:ro"
      -v "$CI_PROJECT_DIR/.gitlab-ci.yml:/workspace/.gitlab-ci.yml:ro"
      -w /workspace/backend
      eclipse-temurin:17-jdk
      sh ./gradlew test --no-daemon
    - >
      docker run --rm
      --user "$(id -u):$(id -g)"
      -e DIO_NOTIFICATION_CONTRACT_OUTPUT=/evidence/notification-frontend-contract.json
      -v "$CI_PROJECT_DIR/frontend:/workspace/frontend:ro"
      -v "$CI_PROJECT_DIR/backend/build:/evidence:ro"
      -w /workspace/frontend
      node:24-alpine
      node --test tests/spring-notification-contract.test.js
  artifacts:
    when: always
    reports:
      junit: backend/build/test-results/test/*.xml
    paths:
      - backend/build/reports/tests/test/
      - backend/build/contracts/
    expire_in: 7 days

release-migration-guard-test:
  stage: quality
  tags:
    - ec2-deploy
  image: alpine:3.21
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .gitlab-ci.yml
        - infra/scripts/assert-shared-db-migrations.sh
        - infra/scripts/test-assert-shared-db-migrations.sh
  script:
    - apk add --no-cache bash git
    - bash infra/scripts/test-assert-shared-db-migrations.sh

# PostgreSQL 잡: MR에서는 스키마·해당 테스트 변경에만 자동 실행하고 나머지는 수동, develop 파이프라인에서는 배포 전에 항상 실행한다.
backend-postgres-auth-test:
  stage: quality
  needs:
    - job: backend-test
      artifacts: false
      # develop 파이프라인에는 backend-test가 없으므로 선택 의존으로 둔다.
      optional: true
  tags:
    - ec2-deploy
  cache:
    key: backend-gradle-v1
    paths:
      - backend/.gradle/caches/
      - backend/.gradle/wrapper/
    policy: pull
  interruptible: true
  rules:
    # develop 파이프라인은 변경 경로와 무관하게 배포 전에 항상 실행한다.
    # 앞선 파이프라인이 취소돼도 배포하는 파이프라인이 직접 검증하므로 검증 없이 배포되지 않는다.
    - if: '$CI_COMMIT_BRANCH == "develop"'
    # MR에서는 스키마(Flyway)나 이 묶음이 실행하는 테스트(부모 클래스 포함)가 바뀐 경우에만 자동 실행한다.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/src/main/resources/db/migration/**/*
        - infra/scripts/test-auth-postgres.sh
        - backend/src/test/java/**/auth/**/*Postgres*.java
        - backend/src/test/java/**/auth/integration/PasswordResetTests.java
        - backend/src/test/java/**/notification/**/*Postgres*.java
    # 그 밖의 백엔드·CI 변경은 필요할 때 수동으로 실행한다. 실행하지 않아도 파이프라인을 막지 않는다.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
      when: manual
      allow_failure: true
  script:
    - bash infra/scripts/test-auth-postgres.sh auth
  artifacts:
    when: always
    reports:
      junit:
        - backend/build/test-results/authPostgresTest/*.xml
    paths:
      - backend/build/reports/tests/authPostgresTest/
    expire_in: 7 days

