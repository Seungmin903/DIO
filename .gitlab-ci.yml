stages:
  - check
  - quality
  - review
  - deploy
  - edge

runner-check:
  stage: check
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - whoami
    - docker --version
    - docker ps

deploy-development:
  stage: deploy
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  resource_group: development
  environment:
    name: development
  script:
    - export BACKEND_IMAGE="dio-backend:dev-${CI_COMMIT_SHORT_SHA}"
    # 필수 인증·SMTP·프록시 환경변수 누락 시 이미지 빌드/컨테이너 교체 전에 중단한다.
    # 옛 SIGNUP_PHOTO_* 저장소 변수는 더 이상 읽지 않으므로 남아 있으면 배포 전에 중단한다.
    - bash infra/scripts/assert-no-legacy-photo-env.sh /home/gitlab-runner/dio-env/dev.env
    - docker compose --project-name dio-dev-backend --env-file /home/gitlab-runner/dio-env/dev.env -f infra/compose/compose.dev.yml config --quiet
    - docker build --tag "dio-backend:dev-${CI_COMMIT_SHORT_SHA}" ./backend
    - docker compose --project-name dio-dev-backend --env-file /home/gitlab-runner/dio-env/dev.env -f infra/compose/compose.dev.yml up -d --force-recreate
    - curl --fail --retry 12 --retry-all-errors --retry-delay 2 http://127.0.0.1:8081/actuator/health

deploy-production:
  stage: deploy
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
  resource_group: production
  environment:
    name: production
  script:
    - bash infra/scripts/assert-flyway-initial-state.sh app-db-1
    - export BACKEND_IMAGE="dio-backend:prod-${CI_COMMIT_SHORT_SHA}"
    # 필수 인증·SMTP·프록시 환경변수 누락 시 이미지 빌드/컨테이너 교체 전에 중단한다.
    # 옛 SIGNUP_PHOTO_* 저장소 변수는 더 이상 읽지 않으므로 남아 있으면 배포 전에 중단한다.
    - bash infra/scripts/assert-no-legacy-photo-env.sh /home/gitlab-runner/dio-env/prod.env
    - docker compose --project-name dio-prod-backend --env-file /home/gitlab-runner/dio-env/prod.env -f infra/compose/compose.prod.yml config --quiet
    - docker build --tag "dio-backend:prod-${CI_COMMIT_SHORT_SHA}" ./backend
    - docker compose --project-name dio-prod-backend --env-file /home/gitlab-runner/dio-env/prod.env -f infra/compose/compose.prod.yml up -d --force-recreate
    - curl --fail --retry 12 --retry-all-errors --retry-delay 2 http://127.0.0.1:8082/actuator/health

deploy-dev-proxy:
  stage: edge
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - infra/nginx/dev/**/*
        - infra/compose/compose.proxy.dev.yml
  resource_group: development-edge
  script:
    - docker build --tag "dio-nginx-dev:${CI_COMMIT_SHORT_SHA}" ./infra/nginx/dev
    - export NGINX_DEV_IMAGE="dio-nginx-dev:${CI_COMMIT_SHORT_SHA}"
    - docker compose --project-name dio-proxy-dev -f infra/compose/compose.proxy.dev.yml run --rm --no-deps nginx-dev nginx -t
    - docker compose --project-name dio-proxy-dev -f infra/compose/compose.proxy.dev.yml up -d --force-recreate

deploy-prod-proxy:
  stage: edge
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
      changes:
        - infra/nginx/prod/**/*
        - infra/compose/compose.proxy.prod.yml
  resource_group: production-edge
  script:
    - docker build --tag "dio-nginx-prod:${CI_COMMIT_SHORT_SHA}" ./infra/nginx/prod
    - export NGINX_PROD_IMAGE="dio-nginx-prod:${CI_COMMIT_SHORT_SHA}"
    - docker compose --project-name dio-proxy-prod -f infra/compose/compose.proxy.prod.yml run --rm --no-deps nginx-prod nginx -t
    - docker compose --project-name dio-proxy-prod -f infra/compose/compose.proxy.prod.yml up -d --force-recreate
    - 'curl --fail --retry 12 --retry-all-errors --retry-delay 2 --resolve k15f106.p.ssafy.io:443:127.0.0.1 https://k15f106.p.ssafy.io/actuator/health'

backend-test:
  stage: quality
  tags:
    - ec2-deploy
  cache:
    key: backend-gradle-v1
    paths:
      - backend/.gradle/caches/
      - backend/.gradle/wrapper/
    policy: pull-push
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      # 백엔드 산출물을 만드는 작업이므로 프런트엔드 전용 변경에서는 실행하지 않는다.
      changes: &backend_contract_changes
        - backend/**/*
        - .gitlab-ci.yml
        - infra/compose/compose.*.yml
        - infra/nginx/**/default.conf
        - infra/scripts/test-auth-postgres.sh
        - infra/scripts/check-member-list-icu.sh
  script:
    - >
      docker run --rm
      --user "$(id -u):$(id -g)"
      -e GRADLE_USER_HOME=/workspace/backend/.gradle
      -e DIO_NOTIFICATION_CONTRACT_OUTPUT=/workspace/backend/build/notification-frontend-contract.json
      -v "$CI_PROJECT_DIR/backend:/workspace/backend"
      -v "$CI_PROJECT_DIR/infra:/workspace/infra:ro"
      -v "$CI_PROJECT_DIR/.gitlab-ci.yml:/workspace/.gitlab-ci.yml:ro"
      -w /workspace/backend
      eclipse-temurin:17-jdk
      sh ./gradlew test --no-daemon
    - >
      docker run --rm
      --user "$(id -u):$(id -g)"
      -e DIO_NOTIFICATION_CONTRACT_OUTPUT=/evidence/notification-frontend-contract.json
      -v "$CI_PROJECT_DIR/frontend:/workspace/frontend:ro"
      -v "$CI_PROJECT_DIR/backend/build:/evidence:ro"
      -w /workspace/frontend
      node:24-alpine
      node --test tests/spring-notification-contract.test.js
  artifacts:
    when: always
    reports:
      junit: backend/build/test-results/test/*.xml
    paths:
      - backend/build/reports/tests/test/
      - backend/build/contracts/
    expire_in: 7 days

# PostgreSQL 잡: MR에서는 스키마·검사 변경에만 자동 실행하고 나머지는 수동, develop 병합 후에는 배포 전에 항상 실행한다.
backend-postgres-auth-test:
  stage: quality
  needs:
    - job: backend-test
      artifacts: false
      # develop 파이프라인에는 backend-test가 없으므로 선택 의존으로 둔다.
      optional: true
  tags:
    - ec2-deploy
  cache:
    key: backend-gradle-v1
    paths:
      - backend/.gradle/caches/
      - backend/.gradle/wrapper/
    policy: pull
  interruptible: true
  rules:
    # develop에 병합된 백엔드 변경은 배포 전에 항상 실행한다. 실패하면 배포 단계로 넘어가지 않는다.
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - backend/**/*
        - infra/scripts/test-auth-postgres.sh
    # MR에서는 스키마(Flyway)나 이 검사 자체가 바뀐 경우에만 자동 실행한다.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/src/main/resources/db/migration/**/*
        - infra/scripts/test-auth-postgres.sh
        - backend/src/test/java/**/auth/**/*Postgres*.java
        - backend/src/test/java/**/notification/**/*Postgres*.java
    # 그 밖의 백엔드·CI 변경은 필요할 때 수동으로 실행한다. 실행하지 않아도 파이프라인을 막지 않는다.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
      when: manual
      allow_failure: true
  script:
    - bash infra/scripts/test-auth-postgres.sh auth
  artifacts:
    when: always
    reports:
      junit:
        - backend/build/test-results/authPostgresTest/*.xml
    paths:
      - backend/build/reports/tests/authPostgresTest/
    expire_in: 7 days

