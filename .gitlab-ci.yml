  cache:
    key: backend-gradle-v1
    paths:
      - backend/.gradle/caches/
      - backend/.gradle/wrapper/
    policy: pull
  interruptible: true
  rules:
    # MR 변경 스크립트를 배포 호스트에서 실행하지 않는다.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true"'
