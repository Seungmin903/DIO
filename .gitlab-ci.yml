secret-scan:
  stage: quality
  tags:
    - ec2-deploy
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - >
      docker run --rm
      -v "$CI_PROJECT_DIR:/repo:ro"
      ghcr.io/gitleaks/gitleaks:v8.30.1
      dir /repo --redact --no-banner

ai-code-review:
  stage: review
  # 테스트 결과를 쓰지 않으므로 quality 단계를 기다리지 않고 바로 시작한다.
  needs: []
  tags:
    - ec2-deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    GIT_DEPTH: "0"
  interruptible: true
  timeout: 15m
  allow_failure: true
  script:
    - bash infra/review/mr-review.sh
