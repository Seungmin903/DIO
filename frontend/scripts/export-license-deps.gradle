import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ProjectComponentIdentifier

// Run against the same Android project/variant as the APK/AAB being audited.
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return
    app.tasks.register('dioLicenseInventory') {
        doLast {
            def configName = app.findProperty('dioLicenseConfiguration') ?: 'releaseRuntimeClasspath'
            def config = app.configurations.getByName(configName)
            def artifacts = config.incoming.artifactView {
                componentFilter { id -> !(id instanceof ProjectComponentIdentifier) }
            }.artifacts.artifacts.collect { artifact ->
                def id = artifact.id.componentIdentifier
                [coordinate:"${id.group}:${id.module}:${id.version}", group:id.group,
                 name:id.module, version:id.version,
                 file:artifact.file.absolutePath, type:artifact.file.name.tokenize('.').last()]
            }.sort { it.coordinate }
            def projects = config.incoming.resolutionResult.allComponents.findAll {
                it.id instanceof ProjectComponentIdentifier
            }.collect { component ->
                def project = gradle.rootProject.findProject(component.id.projectPath)
                [project:component.id.projectPath, directory:project?.projectDir?.absolutePath]
            }.sort { it.project }
            def target = new File(app.findProperty('dioLicenseOutput') ?: new File(app.buildDir, 'reports/licenses/native-dependencies.json').absolutePath)
            target.parentFile.mkdirs()
            target.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                schema:1, configuration:configName, artifacts:artifacts, projects:projects
            ]))
            println "DIO_LICENSE_INVENTORY: ${artifacts.size()} artifacts, ${projects.size()} projects -> ${target}"
        }
    }
}
