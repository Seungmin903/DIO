# 접속 로그에 초대 토큰·쿼리 문자열·Referer 경로가 남지 않도록 가린다.
# $uri는 슬래시 병합·퍼센트 디코딩·./.. 처리가 끝난 경로라 //invite/<토큰> 같은 변형도 같은 규칙에 걸리고, 쿼리 문자열은 포함하지 않는다.
# rewrite·error_page가 없어 내부 리다이렉트가 일어나지 않는다. 유일한 try_files(/invite/ 안내 페이지)는 $uri를 /invite/index.html로 바꾸므로 토큰이 남지 않는다.
# 내부 리다이렉트를 더하면 로그 시점의 $uri가 실제 요청 경로와 같은지 다시 확인한다.
# error_log는 형식을 바꿀 수 없어 업스트림 오류 때 원본 요청 줄(토큰·쿼리 포함)과 Referer 전체가 남는다.
map $uri $dio_log_uri {
    "~^(?<invite_prefix>/api/v1/invites/|/invite/)[^/]+(?<invite_rest>.*)$" "${invite_prefix}[REDACTED]${invite_rest}";
    default $uri;
}

map $http_referer $dio_log_referer {
    "~^(?<referer_origin>https?://[^/?#]+)" $referer_origin;
    default "-";
}

log_format dio_masked '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $dio_log_uri $server_protocol" $status $body_bytes_sent '
                      '"$dio_log_referer" "$http_user_agent"';

resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 5s;

server {
    listen 80;
    server_name k15f106.p.ssafy.io;
    access_log /var/log/nginx/access.log dio_masked;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name k15f106.p.ssafy.io;
    access_log /var/log/nginx/access.log dio_masked;

    ssl_certificate     /etc/letsencrypt/live/k15f106.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k15f106.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 6m;

    # 앱 링크 확인 파일: 초대 링크(https://k15f106.p.ssafy.io/invite/...)를 누르면 브라우저 대신 앱이 열리게 한다.
    # 휴대폰이 인증 · 리다이렉트 없이 HTTP 200 JSON 으로 받아야 한다(Android assetlinks · iOS apple-app-site-association).
    location = /.well-known/assetlinks.json {
        root /usr/share/nginx/dio;
        types { }
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /.well-known/apple-app-site-association {
        root /usr/share/nginx/dio;
        types { }
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }

    # 앱이 링크를 받지 못했을 때(미설치 · 확인 실패 · 메신저 내장 브라우저) 보이는 초대 안내 페이지.
    # 앱은 /api/v1/invites/{token} 으로 초대를 확인하므로 /invite/ 는 브라우저만 쓴다. 토큰을 다른 곳에 보내지 않는다.
    location ^~ /invite/ {
        root /usr/share/nginx/dio;
        try_files $uri /invite/index.html;
        add_header Cache-Control "no-store";
        add_header Referrer-Policy "no-referrer";
        add_header X-Robots-Tag "noindex, nofollow";
        add_header X-Content-Type-Options "nosniff";
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    }

    # Three 5MiB report images plus multipart metadata. Other routes retain their limits.
    location = /api/v1/reports {
        client_max_body_size 16m;
        set $backend_host backend-prod;
        proxy_pass http://$backend_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
    }

    location = /api/v1/media {
        client_max_body_size 26m;
        set $backend_host backend-prod;
        proxy_pass http://$backend_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /ws/ {
        set $backend_host backend-prod;
        proxy_pass http://$backend_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 외부 Host·포트를 보존한다. 포트는 compose.proxy의 외부 바인딩과 맞춘다.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 60s;
    }

    location / {
        set $backend_host backend-prod;
        proxy_pass http://$backend_host:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
    }
}
