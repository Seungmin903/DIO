resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 5s;

server {
    listen 80;
    server_name k15f106.p.ssafy.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name k15f106.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/k15f106.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k15f106.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        set $backend_host backend-prod;
        proxy_pass http://$backend_host:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
