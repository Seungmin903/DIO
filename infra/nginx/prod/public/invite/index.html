<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>DIO 다이어리 초대</title>
  <style>
    /* 앱 토큰(src/shared/theme.js): surfaceSoft · surface · primaryStrong · primary · text · textMuted · cardBorder */
    :root { --bg: #F8F7FD; --surface: #FFFFFF; --primary-strong: #625BA7; --primary: #817DB9; --text: #1C1C1C; --muted: rgba(28,28,28,0.68); --border: #D9D8EA; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; word-break: keep-all; }
    main { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .card { width: 100%; max-width: 400px; padding: 32px 24px 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; text-align: center; }
    .mascot { width: 96px; height: 96px; display: block; margin: 0 auto 16px; }
    h1 { margin: 0; font-size: 22px; line-height: 1.35; font-weight: 800; }
    .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 24px; }
    .button { display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 16px; border-radius: 14px; font: inherit; font-size: 15px; font-weight: 700; text-decoration: none; cursor: pointer; }
    .primary { border: 0; background: var(--primary-strong); color: #FFFFFF; }
    .secondary { border: 1px solid var(--primary); background: var(--surface); color: #514A96; }
    .hint { margin: 16px 0 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
    .toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); padding: 10px 18px; border-radius: 999px; background: var(--text); color: #FFFFFF; font-size: 13px; font-weight: 700; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="title">
      <img class="mascot" src="/invite/dio.svg" alt="" width="96" height="96">
      <h1 id="title">다이어리에 초대받았어요</h1>
      <div class="actions" id="actions" hidden>
        <a class="button primary" id="open-app" href="#" hidden>앱에서 열기</a>
        <button class="button secondary" id="copy-link" type="button">초대 링크 복사</button>
      </div>
      <p class="hint" id="hint" hidden>DIO 앱의 + → 초대 링크로 참여에 붙여 넣어 주세요.</p>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="/invite/invite.js"></script>
</body>
</html>
