resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 5s;

server {
    listen 443 ssl;
    server_name k15f106.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/k15f106.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k15f106.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "DIO Development";
    auth_basic_user_file /etc/nginx/conf.d/nginx-dev.htpasswd;

    # Spring multipart max-request-size와 일치 (사진 파일은 최대 5MB).
    client_max_body_size 6m;

    location / {
        set $backend_host backend-dev;
        proxy_pass http://$backend_host:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
