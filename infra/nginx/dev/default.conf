# 접속 로그에 초대 토큰·쿼리 문자열·Referer 경로가 남지 않도록 가린다.
# $uri는 슬래시 병합·퍼센트 디코딩·./.. 처리가 끝난 경로라 //invite/<토큰> 같은 변형도 같은 규칙에 걸리고, 쿼리 문자열은 포함하지 않는다.
# 이 설정에는 try_files·rewrite·error_page가 없어 내부 리다이렉트가 일어나지 않으므로, 로그 시점의 $uri는 실제 요청 경로와 같다. 내부 리다이렉트를 추가하면 이 전제를 다시 확인한다.
# error_log는 형식을 바꿀 수 없어 업스트림 오류 때 원본 요청 줄(토큰·쿼리 포함)과 Referer 전체가 남는다.
map $uri $dio_log_uri {
    "~^(?<invite_prefix>/api/v1/invites/|/invite/)[^/]+(?<invite_rest>.*)$" "${invite_prefix}[REDACTED]${invite_rest}";
    default $uri;
}

map $http_referer $dio_log_referer {
    "~^(?<referer_origin>https?://[^/?#]+)" $referer_origin;
    default "-";
}

log_format dio_masked '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $dio_log_uri $server_protocol" $status $body_bytes_sent '
                      '"$dio_log_referer" "$http_user_agent"';

resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 5s;

server {
    listen 443 ssl;
    server_name k15f106.p.ssafy.io;
    access_log /var/log/nginx/access.log dio_masked;

    ssl_certificate     /etc/letsencrypt/live/k15f106.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k15f106.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "DIO Development";
    auth_basic_user_file /etc/nginx/conf.d/nginx-dev.htpasswd;

    client_max_body_size 6m;

    # Three 5MiB report images plus multipart metadata. Other routes retain their limits.
    location = /api/v1/reports {
        client_max_body_size 16m;
        set $backend_host backend-dev;
        proxy_pass http://$backend_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 8443;
    }

    location = /api/v1/media {
        client_max_body_size 26m;
        set $backend_host backend-dev;
        proxy_pass http://$backend_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 8443;
    }

    location /ws/ {
        set $backend_host backend-dev;
        proxy_pass http://$backend_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 외부 Host·포트를 보존한다. 포트는 compose.proxy의 외부 바인딩과 맞춘다.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_read_timeout 60s;
    }

    location / {
        set $backend_host backend-dev;
        proxy_pass http://$backend_host:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 8443;
    }
}
