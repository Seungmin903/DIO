services:
  release-db-check:
    image: postgres:17
    entrypoint: ["sh", "-ec"]
    command: >-
      PGPASSWORD="$$POSTGRES_PASSWORD" psql -X -qAt -v ON_ERROR_STOP=1
      -h db -U "$$POSTGRES_USER" -d postgres
      -c "SELECT 1 FROM pg_database WHERE datname = 'dio_release'" | grep -qx 1
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    networks:
      - development-db

networks:
  development-db:
    external: true
    name: dio-dev_default
