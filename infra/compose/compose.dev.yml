services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: "jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    networks:
      development-db:
      proxy:
        aliases:
          - backend-dev

networks:
  development-db:
    external: true
    name: dio-dev_default
  proxy:
    external: true
    name: dio-proxy
