<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>인덱스 탭과 소품 견본</title>
<style>
  :root { --surface:#FFFFFF; --muted:#F0F1F9; --lav:#DBDCF9; --border:#D9DCEF; --primary:#818AC3; --strong:#606BB2; --ptext:#525FAD; --sec:#ABB1D8; --text:#0B1766; --butter:#FEF0BF; --tape:#FBE5A3; --paper:#F7F8FD; }
  * { box-sizing: border-box; }
  body { margin:0; padding:28px 32px; width:1200px; background:#fff; color:var(--text); font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif; }
  h2 { font-size:20px; margin:0 0 6px; }
  .note { font-size:13px; color:var(--ptext); margin:0 0 14px; font-weight:600; }
  .variant { margin-bottom:34px; }
  .row { display:flex; align-items:flex-end; }
  .panel { height:84px; border-radius:0 16px 16px 16px; }
  .lbl { font-size:15px; font-weight:700; }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:22px; }
  .card { border:1px solid var(--border); border-radius:16px; padding:18px; min-height:170px; position:relative; background:#fff; }
  .card h3 { font-size:15px; margin:0 0 12px; }
</style></head><body>
<div id="tabs">
<!-- 탭들은 스크립트가 SVG 로 그린다 -->
</div>
<div id="props" style="margin-top:10px"></div>
<script>
const C = { surface:'#FFFFFF', muted:'#F0F1F9', lav:'#DBDCF9', border:'#D9DCEF', ptext:'#525FAD', text:'#0B1766', butter:'#FEF0BF', tape:'#FBE5A3', peri:'#C9CDEE', lav2:'#E7E8F8', sec:'#ABB1D8', strong:'#606BB2' };
const LABELS = ['폰트','스티커','표지','속지','프리셋'];
const SEL = 1; // 스티커를 고른 상태로 그린다

function svg(w, h, inner) { return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;overflow:visible">${inner}</svg>`; }

// 지금: 사다리꼴, 폭 128, 높이 42/50, 14 겹침, 탭마다 색, 아래 6 띠
function current() {
  const tones = [C.lav, C.butter, C.peri, C.tape, C.lav2];
  const W = 128, SL = 12, CO = 8, OV = 14;
  let x = 0, parts = [], top = 60;
  const order = LABELS.map((_, i) => i).sort((a, b) => (a === SEL ? 1 : b === SEL ? -1 : b - a));
  for (const i of order) {
    const h = i === SEL ? 50 : 42, x0 = i * (W - OV), y0 = top - h;
    const d = `M${x0} ${top} L${x0+SL} ${y0+CO} Q${x0+SL+1.5} ${y0} ${x0+SL+CO} ${y0} L${x0+W-SL-CO} ${y0} Q${x0+W-SL-1.5} ${y0} ${x0+W-SL} ${y0+CO} L${x0+W} ${top} Z`;
    parts.push(`<path d="${d}" fill="${tones[i]}"/><text x="${x0+W/2}" y="${top-h/2+6}" text-anchor="middle" font-size="15" font-weight="${i===SEL?800:700}" fill="${C.text}">${LABELS[i]}</text>`);
  }
  parts.push(`<rect x="0" y="${top}" width="1100" height="6" rx="3" fill="${tones[SEL]}"/>`);
  return svg(1100, 70, parts.join(''));
}

// 시안 A: 바인더 등 라벨형 — 둥근 위 모서리 10, 수직 옆면, 선택 탭은 흰 패널과 한 면(아래 오목 플레어 6), 8 겹침
function variantA() {
  const top = 60, R = 10, F = 6, OV = 8;
  const faces = [C.muted, C.tape, C.muted, C.muted, C.muted]; // 버터는 스티커 한 칸만
  let xs = [], x = 0;
  LABELS.forEach((_, i) => { const w = i === SEL ? 116 : 108; xs.push([x, w]); x += w - OV; });
  const order = LABELS.map((_, i) => i).sort((a, b) => (a === SEL ? 1 : b === SEL ? -1 : b - a));
  let parts = [];
  // 패널(흰 면 + 위 테두리)
  const panelTop = top;
  parts.push(`<rect x="-1" y="${panelTop}" width="1102" height="18" rx="0" fill="${C.surface}"/>`);
  parts.push(`<line x1="0" y1="${panelTop+0.5}" x2="1100" y2="${panelTop+0.5}" stroke="${C.border}"/>`);
  for (const i of order) {
    const [x0, w] = xs[i], sel = i === SEL, h = sel ? 50 : 42, y0 = top - h;
    if (sel) {
      const d = `M${x0-F} ${top} Q${x0} ${top} ${x0} ${top-F} L${x0} ${y0+R} Q${x0} ${y0} ${x0+R} ${y0} L${x0+w-R} ${y0} Q${x0+w} ${y0} ${x0+w} ${y0+R} L${x0+w} ${top-F} Q${x0+w} ${top} ${x0+w+F} ${top}`;
      parts.push(`<path d="${d} L${x0+w+F} ${top+2} L${x0-F} ${top+2} Z" fill="${C.surface}"/>`);
      parts.push(`<path d="${d}" fill="none" stroke="${C.border}"/>`);
    } else {
      const d = `M${x0} ${top} L${x0} ${y0+R} Q${x0} ${y0} ${x0+R} ${y0} L${x0+w-R} ${y0} Q${x0+w} ${y0} ${x0+w} ${y0+R} L${x0+w} ${top} Z`;
      parts.push(`<path d="${d}" fill="${faces[i]}" stroke="${C.border}"/>`);
    }
    parts.push(`<text x="${x0+w/2}" y="${top-h/2+6}" text-anchor="middle" font-size="15" font-weight="700" fill="${sel?C.text:C.ptext}">${LABELS[i]}</text>`);
  }
  return svg(1100, 80, parts.join(''));
}

// 시안 B: 개선한 사다리꼴 — 위가 양쪽 5씩 좁음, 위 모서리 8, 12 겹침, 라벤더 중심, 선택 탭이 패널(라벤더)로 4 겹쳐 들어가고 띠 없음
function variantB() {
  const top = 60, SL = 5, CO = 8, OV = 12;
  let xs = [], x = 0;
  LABELS.forEach((_, i) => { const w = i === SEL ? 122 : 112; xs.push([x, w]); x += w - OV; });
  const order = LABELS.map((_, i) => i).sort((a, b) => (a === SEL ? 1 : b === SEL ? -1 : b - a));
  let parts = [`<rect x="0" y="${top}" width="1100" height="18" fill="${C.lav}"/>`];
  for (const i of order) {
    const [x0, w] = xs[i], sel = i === SEL, h = sel ? 50 : 42, y0 = top - h, bottom = sel ? top + 4 : top;
    const d = `M${x0} ${bottom} L${x0+SL} ${y0+CO} Q${x0+SL+1} ${y0} ${x0+SL+CO} ${y0} L${x0+w-SL-CO} ${y0} Q${x0+w-SL-1} ${y0} ${x0+w-SL} ${y0+CO} L${x0+w} ${bottom} Z`;
    parts.push(`<path d="${d}" fill="${sel ? C.lav : C.lav2}" stroke="${sel ? 'none' : C.border}"/>`);
    parts.push(`<text x="${x0+w/2}" y="${top-h/2+6}" text-anchor="middle" font-size="15" font-weight="${sel?800:700}" fill="${sel?C.text:C.ptext}">${LABELS[i]}</text>`);
    if (sel) parts.push(`<rect x="${x0+w-34}" y="${y0-8}" width="30" height="18" rx="4" fill="${C.butter}"/><text x="${x0+w-19}" y="${y0+5}" text-anchor="middle" font-size="11" font-weight="800" fill="${C.text}">내 것</text>`);
  }
  return svg(1100, 80, parts.join(''));
}

// 시안 C: 견출지 스택형 — 위 모서리 8 직사각, 폭 104, 높이 40/48, 간격 6, 겹침 없음, 선택만 2 내려와 패널 테두리를 덮음
function variantC() {
  const top = 60, R = 8, W = 104, GAP = 6;
  let parts = [`<rect x="0" y="${top}" width="1100" height="18" fill="${C.surface}"/><line x1="0" y1="${top+0.5}" x2="1100" y2="${top+0.5}" stroke="${C.border}"/>`];
  LABELS.forEach((label, i) => {
    const sel = i === SEL, h = sel ? 48 : 40, x0 = i * (W + GAP), y0 = top - h, bottom = sel ? top + 2 : top;
    const d = `M${x0} ${bottom} L${x0} ${y0+R} Q${x0} ${y0} ${x0+R} ${y0} L${x0+W-R} ${y0} Q${x0+W} ${y0} ${x0+W} ${y0+R} L${x0+W} ${bottom} Z`;
    parts.push(`<path d="${d}" fill="${sel ? C.lav : C.muted}"/>`);
    parts.push(`<text x="${x0+W/2}" y="${top-h/2+6}" text-anchor="middle" font-size="14" font-weight="700" fill="${sel?C.text:C.ptext}">${label}</text>`);
    if (i === 4) parts.push(`<rect x="${x0+W-30}" y="${y0-9}" width="28" height="18" rx="3" fill="${C.butter}"/><text x="${x0+W-16}" y="${y0+4}" text-anchor="middle" font-size="10" font-weight="800" fill="${C.text}">NEW</text>`);
  });
  return svg(1100, 80, parts.join(''));
}

document.getElementById('tabs').innerHTML = [
  ['지금', '사다리꼴 · 폭 128 · 높이 42/50 · 14 겹침 · 탭마다 다른 색 · 아래 6 띠', current()],
  ['시안 A — 바인더 등 라벨형 (코덱스 추천)', '위 모서리 10 · 수직 옆면 · 폭 108/116 · 높이 42/50 · 8 겹침 · 선택 탭은 흰 패널과 한 면(아래 오목 플레어 6) · 버터는 스티커 한 칸', variantA()],
  ['시안 B — 개선한 사다리꼴', '위가 양쪽 5씩 좁음 · 위 모서리 8 · 폭 112/122 · 12 겹침 · 라벤더 패널로 선택 탭이 4 겹쳐 들어감 · 띠 없음 · 선택 탭에 "내 것" 라벨', variantB()],
  ['시안 C — 견출지 스택형', '위 모서리 8 직사각 · 폭 104 · 높이 40/48 · 6 간격(겹침 없음) · 선택만 2 내려와 패널 선을 덮음 · NEW 견출지', variantC()],
].map(([t, n, s]) => `<div class="variant"><h2>${t}</h2><p class="note">${n}</p>${s}</div>`).join('');

// 문방구 소품 견본(색은 UI 색상 계열 + 버터만)
const tape = (w, h, r, color) => `<svg width="${w}" height="${h}" style="position:absolute;transform:rotate(${r}deg)"><path d="M0 2 L4 0 L8 2 L12 0 L16 2 L${w-16} 2 L${w-12} 0 L${w-8} 2 L${w-4} 0 L${w} 2 L${w} ${h-2} L${w-4} ${h} L${w-8} ${h-2} L${w-12} ${h} L${w-16} ${h-2} L16 ${h-2} L12 ${h} L8 ${h-2} L4 ${h} L0 ${h-2} Z" fill="${color}" opacity=".92"/></svg>`;
const props = [
  ['견출지 라벨', '다이어리 카드의 상태(최근 편집 · 공유 중). 높이 24 · 반경 6', `<div style="display:flex;gap:8px"><span style="background:${C.lav};padding:4px 10px;border-radius:6px;font-size:12px;font-weight:700">최근 편집</span><span style="background:${C.butter};padding:4px 10px;border-radius:6px;font-size:12px;font-weight:700">공유 중</span></div>`],
  ['마스킹 테이프', '사진 · 표지 미리보기 고정. 48×18 · ±3°', `<div style="position:relative;width:150px;height:100px;background:${C.muted};border-radius:6px;margin-top:14px"><div style="position:absolute;left:51px;top:-9px">${tape(48,18,-3,C.tape)}</div></div>`],
  ['포스트잇', '빈 화면의 한 줄. 144×92 · 반경 4 · -2°', `<div style="width:144px;height:92px;background:${C.butter};border-radius:4px;transform:rotate(-2deg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;box-shadow:0 6px 14px rgba(11,23,102,.08)">지운 기록이 없어요</div>`],
  ['영수증', '저장 · 내보내기 완료 알림(가운데 모달 아님). 폭 220 · 위아래 톱니 6', `<svg width="220" height="76"><path d="M0 6 ${Array.from({length:22},(_,k)=>`L${k*10+5} 0 L${k*10+10} 6`).join(' ')} L220 70 ${Array.from({length:22},(_,k)=>`L${215-k*10} 76 L${210-k*10} 70`).join(' ')} Z" fill="${'#F7F8FD'}" stroke="${C.sec}"/><text x="110" y="34" text-anchor="middle" font-size="14" font-weight="800" fill="${C.text}">PNG 3장 저장</text><text x="110" y="54" text-anchor="middle" font-size="12" font-weight="600" fill="${C.ptext}">2026.10.31 · 여름 방학 일기</text></svg>`],
  ['도장', '초대 수락 · 완료. 지름 32 · 표시 전용(튀는 연출 없음)', `<svg width="70" height="18"><circle cx="35" cy="35" r="30" fill="none" stroke="${C.strong}" stroke-width="2.5" stroke-dasharray="58 3 20 2"/><circle cx="35" cy="35" r="24" fill="none" stroke="${C.strong}" stroke-width="1"/><text x="35" y="40" text-anchor="middle" font-size="13" font-weight="800" fill="${C.strong}">함께해요</text></svg>`],
  ['절취선', '공방 구역 · 초대 상태 구분. 점 3 · 간격 4', `<div style="border-top:1.5px dashed ${C.border};margin:26px 0 12px"></div><div style="font-size:13px;color:${C.ptext};font-weight:700">지난 초대</div>`],
  ['바인더 링', '페이지 목록 · 다이어리 상세 가장자리. 지름 12 · 간격 24 · 3개 이하', `<div style="position:relative;width:150px;height:100px;background:#fff;border:1px solid ${C.border};border-radius:8px">${[22,46,70].map(y=>`<span style="position:absolute;left:10px;top:${y}px;width:12px;height:12px;border-radius:6px;background:${C.muted};border:1px solid ${C.sec}"></span>`).join('')}</div>`],
  ['OPP 봉투', '스티커 폴더. 96×72 · 겹친 면 2장 · 윗변 접착 띠', `<div style="position:relative;width:96px;height:72px"><div style="position:absolute;inset:0;background:${C.muted};border:1px solid ${C.sec};border-radius:6px"></div><div style="position:absolute;left:0;right:0;top:0;height:12px;background:#fff;border:1px solid ${C.sec};border-radius:6px 6px 0 0"></div><div style="position:absolute;left:30px;top:24px;font-size:26px">🌼</div></div>`],
  ['사진 모서리', '홈 첫 표지 · 초대 썸네일. 18 삼각 2개', `<div style="position:relative;width:150px;height:100px;background:${C.peri};border-radius:4px"><svg width="18" height="18" style="position:absolute;left:-3px;top:-3px"><path d="M0 0 L18 0 L0 18 Z" fill="${C.lav}" stroke="${C.sec}"/></svg><svg width="18" height="18" style="position:absolute;right:-3px;bottom:-3px"><path d="M18 18 L0 18 L18 0 Z" fill="${C.lav}" stroke="${C.sec}"/></svg></div>`],
  ['책갈피', '페이지 목록 · 즐겨찾기. 12×20 리본(터치 48)', `<svg width="40" height="40"><path d="M14 4 L26 4 L26 28 L20 23 L14 28 Z" fill="${C.strong}"/></svg>`],
  ['종이 클립', 'PDF로 시작한 다이어리 · 첨부 표시. 선 아이콘 20', `<svg width="40" height="40" fill="none" stroke="${C.ptext}" stroke-width="1.8" stroke-linecap="round"><path d="M24 12 L24 28 Q24 33 19 33 Q14 33 14 28 L14 10 Q14 6 18 6 Q22 6 22 10 L22 26"/></svg>`],
  ['포인트 노랑 규칙', '버터 계열은 한 화면에 한 곳(표지판)만', `<div style="display:flex;gap:10px;align-items:center"><span style="width:40px;height:40px;border-radius:8px;background:${C.butter};border:1px solid ${C.border}"></span><span style="width:40px;height:40px;border-radius:8px;background:${C.tape};border:1px solid ${C.border}"></span><span style="font-size:13px;font-weight:700">#FEF0BF · #FBE5A3</span></div>`],
];
document.getElementById('props').innerHTML = `<h2 style="margin-top:4px">문방구 소품 견본</h2><p class="note">모양 · 크기는 코덱스 제안값, 색은 UI 색상 계열 + 버터만</p><div class="grid">${props.map(([t, n, art]) => `<div class="card"><h3>${t}</h3><p class="note" style="margin-bottom:16px">${n}</p>${art}</div>`).join('')}</div>`;
</script>
</body></html>
