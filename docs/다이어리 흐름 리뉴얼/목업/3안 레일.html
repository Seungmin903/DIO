<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIO 리뉴얼 3안 · 아이콘 레일</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&family=Poor+Story&display=swap">
<link rel="stylesheet" href="공통.css">
<style>
  .rail { width: 84px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0; background: rgba(255,255,255,.95); border-radius: 0 24px 24px 0 }
  .rail button { width: 68px; padding: 8px 0; border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--muted) }
  .rail button .ic { font-size: 20px } .rail button.on { background: var(--soft); color: var(--text); box-shadow: inset 0 0 0 1px var(--primary) }
  .rail .sep { width: 40px; height: 1px; background: var(--border); margin: 4px 0 }
  .split { width: 380px; flex: none; display: grid; grid-template-rows: minmax(0, 42%) minmax(0, 1fr); background: #fff; border-radius: 24px 0 0 24px; overflow: hidden }
  .split .top { overflow: auto; padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px }
  .split .bot { display: flex; flex-direction: column; min-height: 0 }
  .split .bot .side-body { padding-top: 12px }
  .split .cap2 { font-size: 12px; font-weight: 800; color: var(--muted); padding: 2px 4px 6px }
</style>
</head>
<body>
<div id="root"></div><div class="toast" id="toast"></div>
<script src="렌더.js"></script><script src="카탈로그.js"></script><script src="엔진.js"></script>
<script>
// 3안 아이콘 레일: 가장 왼쪽 좁은 레일(편집기 리본처럼 아이콘 + 짧은 이름) | 가장 넓은 미리보기 | 오른쪽 패널을 위·아래로 나눔
// 위 = 무엇을(요소 목록 · 속지 묶음), 아래 = 고른 것의 옵션. 스티커는 편집기처럼 레일의 독립 도구.
const RAIL = () => S.screen === 'add' ? [['paper', '📄', '속지'], ['style', '🖋', '스타일']] : [['basic', '✏️', '기본'], ['cover', '📕', '표지'], ['stickers', '⭐', '스티커'], ...(S.screen === 'edit' ? [] : [['paper', '📄', '속지']]), ['style', '🖋', '스타일']]
ACT.rail = (v) => { if (v === 'stickers') { S.section = 'cover'; S.el = 'stickers'; S.railSt = true; if (!S.cover.enabled) { S.cover.enabled = true } } else { S.section = v; S.railSt = false; if (v === 'cover' && S.el === 'stickers') S.el = 'base' } S.sel = null }
function railHTML() { return RAIL().map(([id, ic, l]) => `${id === 'paper' || (S.screen === 'add' && id === 'style') ? '<span class="sep"></span>' : ''}<button class="${(id === 'stickers' ? S.railSt : S.section === id && !S.railSt) ? 'on' : ''}" data-act="rail" data-v="${id}"><span class="ic">${ic}</span>${l}</button>`).join('') }
function splitHTML() {
  const add = S.screen === 'add', st = add ? S.add : S
  if (S.section === 'paper') return { top: `<div class="cap2">속지 묶음</div>${groupList(add ? 'add' : 'new')}`, bot: paperGrid(add ? 'add' : 'new'), foot: add ? addOptions() : contextOptions() }
  if (S.section === 'basic') return { top: `<div class="cap2">기본</div>${basicOptions()}`, bot: S.screen === 'edit' ? `<div class="card"><div class="ico">📔</div><div class="grow"><div class="lbl">하루 일기 · ${EDIT_DIARY.period}</div><div class="val">속지 종류와 기간은 그대로예요. 더 쓰려면 새 페이지에서 이어 붙여요</div></div></div>` : `<div class="hint">방향은 표지와 속지에 함께 적용돼요. 가운데에서 두 가지를 나란히 확인해요.</div>` }
  if (S.section === 'style') return { top: `<div class="cap2">속지 스타일</div><div class="hint">종이 색 · 선 색 · 글씨체를 바꿔요. 고른 속지에 없는 항목은 나오지 않아요.</div>`, bot: styleOptions(curPaper()) }
  // 표지
  const els = COVER_ELEMENTS(), on = (el, k) => k ? getK('cover.' + k) : el === 'stickers' ? S.cover.stickers.length > 0 : el === 'plate' ? S.cover.plate !== 'none' : true
  const top = `${coverKindOptions()}${S.cover.enabled ? `<div style="margin-top:8px">${els.map(([el, l, d, k]) => `<div class="elrow ${S.el === el ? 'on' : ''}" data-act="el" data-v="${el}" role="button">${k ? `<span data-stop>${sw2(getK('cover.' + k), 'toggle', 'cover.' + k)}</span>` : `<span style="width:44px;text-align:center;color:${on(el, k) ? 'var(--primary)' : 'var(--border)'}">●</span>`}<b>${l}</b><i>${d}</i></div>`).join('')}</div>` : ''}`
  const cur = els.find(([e]) => e === S.el)
  return { top, bot: S.cover.enabled ? `<div class="sec" style="margin:0 0 4px">${cur?.[1] ?? ''}</div>${elementOptions(S.el)}` : `<div class="hint">표지 없이 첫 장부터 시작해요. 다이어리 수정에서 언제든 다시 더할 수 있어요.</div>`, foot: S.screen === 'edit' && S.cover.enabled ? `<button class="btn ghost small" style="color:var(--danger)" data-act="coverKind" data-v="none">표지 빼기</button>` : '' }
}
function stageHTML() {
  const st = $('#stage'), W = st.clientWidth - 60, H = st.clientHeight - 70
  if (S.screen === 'add') { const p = paperById(S.add.paperId), w = Math.min(W * 0.6, H * 4 / 3); return `<div class="row" style="flex-wrap:nowrap;gap:24px;align-items:center"><div style="width:${w * 0.3}px;opacity:.45">${paperPreview(w * 0.3, H, 'weekly', { year: 2026, month: 10, week: 3 })}</div><div class="ghostpage">${paperPreview(w, H, p.kinds[0], addPreviewOpts())}</div><div style="width:${w * 0.3}px;opacity:.45">${paperPreview(w * 0.3, H, 'diary', { year: 2026, month: 10, day: 23 })}</div></div><span class="pill">＋ ${addSummary()}</span>` }
  const p = paperById(S.paperId)
  if (S.section === 'cover') return coverPreview(W * 0.85, H - 10)
  if (S.section === 'paper' || S.section === 'style') return `${paperPreview(W * 0.85, H - 30, p.kinds[0], { year: S.period.year, month: S.period.start, dated: p.type !== 'note' && (p.type !== 'diary' || S.dateStamp) })}<span class="pill">${p.name}</span>`
  const half = W / 2 - 20
  return `<div class="row" style="flex-wrap:nowrap;gap:32px;align-items:center">${coverPreview(half, H - 40)}${paperPreview(half, H - 40, p.kinds[0], { year: S.period.year, month: S.period.start })}</div><span class="cap">${S.orient === 'landscape' ? '가로' : '세로'} · 표지와 속지가 같은 방향이에요</span>`
}
RENDER = () => {
  const sp = splitHTML(), kt = $('.split .top')?.scrollTop ?? 0, kb = $('.split .side-body')?.scrollTop ?? 0
  $('#root').innerHTML = `${switcher('3안 · 아이콘 레일')}<div class="app">${topbar()}
    <main class="main" style="padding:12px 0">
      <nav class="rail">${railHTML()}</nav>
      <section class="board grow" id="stage" style="min-width:0;margin:0 12px"></section>
      <aside class="split"><div class="top">${sp.top}</div><div class="bot"><div class="side-body">${sp.bot}</div>${sp.foot ? `<div class="pfoot">${sp.foot}</div>` : ''}</div></aside>
    </main></div>`
  $('.split .top').scrollTop = kt; $('.split .side-body').scrollTop = kb
  RENDER_STAGE()
}
document.addEventListener('click', (e) => { const s = e.target.closest('[data-stop] [data-act]'); if (s) { e.stopPropagation(); ACT[s.dataset.act](s.dataset.v); RENDER() } }, true)
RENDER_STAGE = () => { const st = $('#stage'); if (st) st.innerHTML = stageHTML() }
RENDER(); window.addEventListener('resize', RENDER); document.fonts?.ready.then(RENDER)
</script>
</body>
</html>
