<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIO 리뉴얼 · 가로·세로 섞인 목록</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&family=Poor+Story&display=swap">
<link rel="stylesheet" href="공통.css">
<style>
  body { background: var(--soft) }
  .lib { display: grid; grid-template-columns: 78px 1fr; height: 100vh }
  .srail { background: #fff; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px 0 }
  .srail span { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; font-size: 18px; color: var(--muted) }
  .srail span.on { background: var(--soft); color: var(--text) } .srail span.add { background: var(--primaryStrong); color: #fff }
  .body { padding: 26px 34px 80px; overflow: auto; display: flex; flex-direction: column; gap: 16px }
  .bar { display: flex; align-items: center; gap: 12px }
  .bar h1 { font-size: 28px; font-weight: 800; margin: 0 }
  .item .nm { font-weight: 800; font-size: 13.5px; margin-top: 8px; display: flex; align-items: center; gap: 6px }
  .item .nm .or { font-size: 10.5px; font-weight: 700; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 1px 5px }
  .item .mt { color: var(--muted); font-size: 11px; font-weight: 600 }
  /* A 선반: 같은 정사각 칸, 아래쪽 맞춤 */
  .gA { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 28px 24px }
  .gA .cell { height: 200px; display: flex; align-items: flex-end; justify-content: center; border-bottom: 2px solid rgba(11,25,87,.08) }
  /* B 판: 같은 칸 안 회색 판 위 가운데 */
  .gB { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px }
  .gB .cell { height: 220px; border-radius: 18px; background: var(--stage); display: grid; place-items: center }
  /* C 줄 높이 맞춤 */
  .gC { display: flex; flex-wrap: wrap; gap: 26px 22px; align-items: flex-end }
  .gC .cell { height: 190px; display: flex; align-items: flex-end }
  .car { display: flex; gap: 40px; align-items: flex-end; overflow-x: auto; padding: 30px 40px 10px; scroll-snap-type: x mandatory }
  .car .item { scroll-snap-align: center; flex: none }
  .opts { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(11,25,87,.86); padding: 6px; border-radius: 999px; z-index: 5 }
  .opts .seg { background: rgba(255,255,255,.12) } .opts .seg button { color: rgba(255,255,255,.75) } .opts .seg button.on { color: var(--text) }
  .noc { position: relative } .noc .tag { position: absolute; left: 8px; top: 8px; font-size: 10px; font-weight: 800; background: rgba(255,255,255,.92); color: var(--muted); padding: 2px 6px; border-radius: 6px }
</style>
</head>
<body>
<div id="root"></div><div class="toast" id="toast"></div>
<script src="렌더.js"></script><script src="카탈로그.js"></script>
<script>
// 가로 · 세로 다이어리가 섞인 목록. A 선반(같은 칸 · 아래 맞춤) / B 판(같은 칸 · 회색 판 위 가운데) / C 줄 높이 맞춤. 캐러셀은 높이 고정 + 아래 맞춤.
const P = new URLSearchParams(location.search)
const L = { opt: P.get('opt') || 'A', mode: P.get('mode') || 'grid' }
const base = { enabled: true, kind: 'plain', pattern: { type: 'linen', tone: 'dark' }, photo: 0, band: { on: true, dir: 'v', pos: 'near', color: '#7D88B5' }, plate: 'paper', title: { font: 'gothic', size: 16, color: '#3B3F4A', anchor: 'tl' }, subtitle: { on: true, text: 'DIARY · 2026', size: 8, color: '#9A9DA6' }, stickers: [] }
const D = [
  ['2026 다이어리', 'portrait', { color: '#9DABD8' }, '1년 플래너'],
  ['봄의 기록', 'landscape', { kind: 'photo', photo: 4, plate: 'none', band: { on: true, dir: 'h', pos: 'near', color: '#FFFFFF' }, title: { font: 'pen', size: 20, color: '#FFFFFF', anchor: 'bl' }, subtitle: { on: true, text: '우리의 봄', size: 9, color: '#FFFFFF' } }, '하루 일기'],
  ['직관 일기', 'portrait', { color: '#2F6B4F', pattern: { type: 'stripe', tone: 'light' }, title: { font: 'nanumgothic', size: 16, color: '#2F6B4F', anchor: 'tl' }, subtitle: { on: true, text: '2026 SEASON', size: 8, color: '#9A9DA6' } }, '야구 직관'],
  ['메모장', 'landscape', null, '모눈 노트'],
  ['여름 교환일기', 'landscape', { color: '#F0B0AA', pattern: { type: 'dot', tone: 'light' }, band: { on: false }, title: { font: 'poor', size: 18, color: '#5B3A3A', anchor: 'mc' }, subtitle: { on: false } }, '사진 일기'],
  ['위클리 플래너', 'portrait', { color: '#474F55', pattern: { type: 'leather', tone: 'light' }, title: { font: 'myeongjo', size: 15, color: '#3B3F4A', anchor: 'bc' } }, '주간 · 블록'],
  ['관극 일기', 'portrait', null, '관극 일기'],
  ['우리 반 앨범', 'landscape', { kind: 'photo', photo: 5, plate: 'ribbon', band: { on: false }, title: { font: 'gothic', size: 16, color: '#0B1957', anchor: 'mc' }, subtitle: { on: false } }, '사진·스크랩'],
]
const firstKind = { '모눈 노트': 'note-grid', '관극 일기': 'musical' }
function art(d, box) {
  const [name, or, cv, kind] = d, w = Math.round(box)
  if (!cv) return `<div class="noc" style="width:${w}px">${pageBox(firstKind[kind] ?? 'note-ruled', { orient: or })}<span class="tag">표지 없음</span></div>`
  const c = { ...base, ...cv, band: { ...base.band, ...(cv.band ?? {}) }, title: { ...base.title, ...(cv.title ?? {}), text: name }, subtitle: { ...base.subtitle, ...(cv.subtitle ?? {}) } }
  return coverHTML(c, w, { orient: or })
}
const itemHTML = (d, box, extra = '') => `<div class="item" ${extra}>${art(d, box)}${L.opt === 'A' || L.mode === 'carousel' ? '' : ''}<div class="nm">${d[0]} <span class="or">${d[1] === 'landscape' ? '가로' : '세로'}</span></div><div class="mt">${d[3]}</div></div>`
function gridHTML() {
  if (L.opt === 'A') return `<div class="gA">${D.map((d) => `<div><div class="cell">${art(d, d[1] === 'landscape' ? 190 : 147)}</div><div class="nm" style="font-weight:800;font-size:13.5px;margin-top:8px;display:flex;gap:6px;align-items:center">${d[0]} <span style="font-size:10.5px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:1px 5px">${d[1] === 'landscape' ? '가로' : '세로'}</span></div><div class="mt" style="color:var(--muted);font-size:11px">${d[3]}</div></div>`).join('')}</div>`
  if (L.opt === 'B') return `<div class="gB">${D.map((d) => `<div><div class="cell">${art(d, d[1] === 'landscape' ? 168 : 126)}</div><div class="nm" style="font-weight:800;font-size:13.5px;margin-top:8px">${d[0]}</div><div class="mt" style="color:var(--muted);font-size:11px">${d[3]}</div></div>`).join('')}</div>`
  return `<div class="gC">${D.map((d) => `<div><div class="cell">${art(d, d[1] === 'landscape' ? 253 : 142)}</div><div class="nm" style="font-weight:800;font-size:13.5px;margin-top:8px">${d[0]}</div><div class="mt" style="color:var(--muted);font-size:11px">${d[3]}</div></div>`).join('')}</div>`
}
function carouselHTML() {
  // 높이 고정(세로 표지 높이 = 가로 표지 높이) + 아래 맞춤. 가로 표지는 넓어진다
  const Hh = 300
  return `<div class="car">${D.map((d, i) => `<div class="item" style="${i === 1 ? '' : 'opacity:.55;transform:scale(.9);transform-origin:bottom'}">${art(d, d[1] === 'landscape' ? Hh * 4 / 3 : Hh * 3 / 4)}<div class="nm" style="font-weight:800;font-size:14px;margin-top:10px">${d[0]}</div></div>`).join('')}</div><div class="hint" style="text-align:center">2 / ${D.length} · 표지 높이를 맞추고 아래쪽 선을 맞춰요</div>`
}
function render() {
  const OPT = { A: 'A 선반 (같은 칸 · 아래 맞춤)', B: 'B 판 (같은 칸 · 가운데)', C: 'C 줄 높이 맞춤' }
  $('#root').innerHTML = `<div class="lib"><nav class="srail"><span>☰</span><span class="add">＋</span><span class="on">📔</span><span>☆</span><span>👤</span><span>🗑</span></nav>
    <main class="body"><div class="bar"><h1>모든 다이어리</h1><span class="grow"></span><span class="hint">${OPT[L.opt]}</span></div>${L.mode === 'grid' ? gridHTML() : carouselHTML()}</main></div>
    <nav class="opts"><div class="seg">${['A', 'B', 'C'].map((o) => `<button class="${L.opt === o ? 'on' : ''}" data-o="${o}">${OPT[o].split(' (')[0]}</button>`).join('')}</div><div class="seg">${[['grid', '한눈에'], ['carousel', '스와이프']].map(([m, l]) => `<button class="${L.mode === m ? 'on' : ''}" data-m="${m}">${l}</button>`).join('')}</div></nav>`
}
document.addEventListener('click', (e) => { const o = e.target.closest('[data-o]'), m = e.target.closest('[data-m]'); if (o) L.opt = o.dataset.o; if (m) L.mode = m.dataset.m; if (o || m) render() })
render(); document.fonts?.ready.then(render)
</script>
</body>
</html>
