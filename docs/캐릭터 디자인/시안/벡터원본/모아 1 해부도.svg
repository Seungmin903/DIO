92C6"/><path d="M212.29508196721312,618.360655737705 L80,720" stroke="#6E92C6" stroke-width="1.6" fill="none"/><circle cx="80" cy="720" r="11" fill="#6E92C6"/><text x="80" y="724.2" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" >8</text><circle cx="523.7704918032787" cy="468.8524590163934" r="3.2" fill="#6E92C6"/><path d="M523.7704918032787,468.8524590163934 L850,560" stroke="#6E92C6" stroke-width="1.6" fill="none"/><circle cx="850" cy="560" r="11" fill="#6E92C6"/><text x="850" y="564.2" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" >9</text><circle cx="911" cy="105" r="11" fill="#6E92C6"/><text x="911" y="109.2" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" >1</text><text x="932" y="110" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12.5" font-weight="800" fill="#0B1957" text-anchor="start" >표지 (몸)</text><text x="932" y="125" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="11.0" font-weight="600" fill="rgba(11,25,87,0.68)" text-anchor="start" >세로 90 : 가로 74 (≈ 5:4). 모서리 반지름 = 너비의 13.5%. 단색 한 면, 그라데이션 · 그림자 없음</text><circle cx="911" cy="163" r="11" fill="#6E92C6"/><text x="911" y="167.2" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" >2</text><text x="932" y="168" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12.5" font-weight="800" fill="#0B1957" text-anchor="start" >속지 묶음</text><text x="932" y="183" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="11.0" font-weight="600" fill="rgba(11,25,87,0.68)" text-anchor="start" >표지 뒤 오른쪽 아래로 (6, 4) 어긋난 흰 블록(#FFFCF6). '책'임을 말하는 유일한 장치</text><circle cx="911" cy="221" r="11" fill="#6E92C6"/><text x="911" y="225.2" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" >3</text><text x="932" y="226" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12.5" font-weight="800" fill="#0B1957" text-anchor="start" >눈</text><text x="932" y="241" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="11.0" font-weight="600" fill="rgba(11,25,87,0.68)" text-anchor="start" >세로 타원 rx 2.9 · ry 3.4 (= 너비의 4%). 간격 22 (너비의 30%), 높이 46 (상자 높이의 38%)</text><circle cx="911" cy="279" r="11" fill="#6E92C6"/><text x="911" y="283.2" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" >4</text><text x="932" y="284" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12.5" font-weight="800" fill="#0B1957" text-anchor="start" >입</text><text x="932" y="299" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="11.0" font-weight="600" fill="rgba(11,25,87,0.68)" text-anchor="start" >폭 12 의 작은 곡선. 입은 늘 작게 — 감정은 스티커가 말한다</text><circle cx="911" cy="337" r="11" fill="#6E92C6"/><text x="911" y="341.2" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" >5</text><text x="932" y="342" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12.5" font-weight="800" fill="#0B1957" text-anchor="start" >팔</text><text x="932" y="357" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="11.0" font-weight="600" fill="rgba(11,25,87,0.68)" text-anchor="start" >굵기 9 + 먹선. 둥근 끝이 그대로 손(벙어리장갑). 손가락 · 관절 없음</text><circle cx="911" cy="395" r="11" fill="#6E92C6"/><text x="911" y="399.2" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" >6</text><text x="932" y="400" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12.5" font-weight="800" fill="#0B1957" text-anchor="start" >다리 · 발</text><text x="932" y="415" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="11.0" font-weight="600" fill="rgba(11,25,87,0.68)" text-anchor="start" >굵기 9, 길이 11, 발은 바깥으로 꺾은 'ㄴ'. 둘 사이 26</text><circle cx="911" cy="453" r="11" fill="#6E92C6"/><text x="911" y="457.2" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" >7</text><text x="932" y="458" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12.5" font-weight="800" fill="#0B1957" text-anchor="start" >스티커 자리</text><text x="932" y="473" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="11.0" font-weight="600" fill="rgba(11,25,87,0.68)" text-anchor="start" >표지 네 모서리(TL · TR · BL · BR) + 양 옆(ML · MR) + 가운데 아래(C). 얼굴 둘레 반지름 16 은 비워 둔다</text><circle cx="911" cy="511" r="11" fill="#6E92C6"/><text x="911" y="515.2" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" >8</text><text x="932" y="516" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12.5" font-weight="800" fill="#0B1957" text-anchor="start" >먹선</text><text x="932" y="531" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="11.0" font-weight="600" fill="rgba(11,25,87,0.68)" text-anchor="start" >#242424 (로고 D 와 같은 색). 굵기 = 상자 높이의 3.3% (4px @122). 끝 · 이음 모두 둥글게</text><circle cx="911" cy="569" r="11" fill="#6E92C6"/><text x="911" y="573.2" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" >9</text><text x="932" y="574" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12.5" font-weight="800" fill="#0B1957" text-anchor="start" >볼</text><text x="932" y="589" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="11.0" font-weight="600" fill="rgba(11,25,87,0.68)" text-anchor="start" >로즈 #F0B0AA 타원. 부끄럼 · 고마움 · 신남 때만 나타난다</text><rect x="900" y="660" width="640" height="300" rx="16" fill="#EEF2F9"/><text x="924" y="690" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="14" font-weight="900" fill="#0B1957" text-anchor="start" >치수 (상자 100 × 122 기준)</text><text x="924" y="718" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="800" fill="#0B1957" text-anchor="start" >표지</text><text x="1050" y="718" font-family="Consolas,'Malgun Gothic',monospace" font-size="12" font-weight="600" fill="rgba(11,25,87,0.68)" text-anchor="start" >x 10 · y 10 · w 74 · h 90 · r 10</text><text x="924" y="747" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="800" fill="#0B1957" text-anchor="start" >속지 묶음</text><text x="1050" y="747" font-family="Consolas,'Malgun Gothic',monospace" font-size="12" font-weight="600" fill="rgba(11,25,87,0.68)" text-anchor="start" >x 16 · y 14 · w 74 · h 90 · r 10</text><text x="924" y="776" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="800" fill="#0B1957" text-anchor="start" >눈</text><text x="1050" y="776" font-family="Consolas,'Malgun Gothic',monospace" font-size="12" font-weight="600" fill="rgba(11,25,87,0.68)" text-anchor="start" >(36, 46) · (58, 46)  rx 2.9  ry 3.4</text><text x="924" y="805" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="800" fill="#0B1957" text-anchor="start" >입</text><text x="1050" y="805" font-family="Consolas,