fill="#6E92C6"/><text x="951" y="605.2" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" >9</text><text x="972" y="606" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="12.5" font-weight="800" fill="#0B1957" text-anchor="start" >먹선</text><text x="972" y="621" font-family="'Malgun Gothic','Nanum Gothic','Noto Sans KR',sans-serif" font-size="11.0" font-weight="600" fill="rgba(11,25,87,0.68)" text-anchor="start" >#242424, 디오와 같은 절대 굵기. 둘이 함께 설 때 선이 같아야 한 세계로 보인다</text></svg>