<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>스토어 첫 5장 구성 시안(예시)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap">
<style>
* { box-sizing: border-box; } html, body { margin: 0; }
body { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; color: #0B1766; word-break: keep-all; -webkit-font-smoothing: antialiased; }
.card { position: relative; width: 540px; height: 960px; overflow: hidden; background: #F3F3F7; }
.card.butter { background: #F0F1F9; } .card.lav { background: #DBDCF9; }
.sm { position: absolute; left: 44px; top: 78px; font-size: 18px; font-weight: 600; color: rgba(11,23,102,.68); letter-spacing: -.2px; }
.big { position: absolute; left: 44px; top: 110px; font-size: 40px; font-weight: 800; letter-spacing: -1.2px; line-height: 1.22; }
.frame { position: absolute; left: 105px; top: 290px; width: 330px; height: 760px; border: 2px solid rgba(11,23,102,.2); border-radius: 40px; background: #fff; overflow: hidden; box-shadow: 0 18px 40px rgba(11,23,102,.12); }
.frame img { width: 100%; display: block; }
.prop { position: absolute; display: block; }
.char { position: absolute; display: block; }
</style></head><body><div id="root"></div>
<script>
const SLIDES = {
  1: { cls: '', sm: '한 장의 사진 위에', big: '친구와 함께<br>붙여 가요', img: '홈 혼합 폰', deco: `<img class="prop" src="에셋/polaroid-sky.png" style="left:18px;top:520px;width:120px;transform:rotate(-8deg)"><img class="prop" src="에셋/tape-butter.png" style="left:40px;top:500px;width:110px;transform:rotate(-8deg);opacity:.85"><img class="char" src="소재/둘이 최종.svg" style="right:14px;top:150px;width:170px">` },
  2: { cls: 'butter', sm: '손글씨도, 스티커도', big: '내 글꼴로<br>꾸며요', img: '공방 혼합 폰', deco: `<img class="prop" src="에셋/sticker-heart.png" style="right:30px;top:620px;width:80px;transform:rotate(10deg)"><img class="prop" src="에셋/tape-lavender.png" style="left:34px;top:236px;width:120px;transform:rotate(-6deg);opacity:.85">` },
  3: { cls: 'lav', sm: '같은 방 친구와만', big: '작은 흔적이<br>쌓여요', img: '홈 B 폰', deco: `<img class="prop" src="에셋/star-clip.png" style="right:26px;top:300px;width:70px;transform:rotate(12deg)">` },
  4: { cls: '', sm: '표지부터', big: '내 취향대로<br>고르세요', img: '홈 혼합 폰', deco: `<img class="prop" src="에셋/bookmark.png" style="right:30px;top:120px;width:70px;transform:rotate(8deg)">` },
  5: { cls: 'butter', sm: '내가 쌓은 기록은', big: '내 공간에<br>모여요', img: '내공간 혼합 폰', deco: `<img class="prop" src="에셋/binder-clip.png" style="left:40px;top:250px;width:70px;transform:rotate(-8deg)">` },
}
const n = Number((decodeURIComponent(location.hash.slice(1)) || '1'))
const s = SLIDES[n]
document.getElementById('root').innerHTML = `<div class="card ${s.cls}"><div class="sm">${s.sm}</div><div class="big">${s.big}</div><div class="frame"><img src="../이미지/시안/${s.img}.jpg"></div>${s.deco}</div>`
</script></body></html>
