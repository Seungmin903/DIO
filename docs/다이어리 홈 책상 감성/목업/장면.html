<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>다이어리 홈 책상 감성 — 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
<link rel="stylesheet" href="공통.css">
</head>
<body>
<!-- 1안 연필선: 선을 살짝 흔들어 손으로 그린 느낌 -->
<svg width="0" height="0" style="position:absolute">
  <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div id="root"></div>
<script src="소품.js"></script>
<script src="장면.js"></script>
<script>render()</script>
</body>
</html>
